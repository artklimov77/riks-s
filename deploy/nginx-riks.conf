# Рикс+С — nginx до выпуска сертификата (/etc/nginx/conf.d/riks.conf): только HTTP.
# Когда домен смотрит на сервер, deploy/https.sh выпускает сертификат и ставит вместо этого файла nginx-riks-ssl.conf.
# Общая часть сайта — deploy/nginx-site.inc.

map $sent_http_content_type $riks_cache {
    default                    "no-cache";
    ~^image/                   "public, max-age=2592000";
    ~^font/                    "public, max-age=2592000";
}

server {
    listen 80;
    listen [::]:80;
    server_name riks-s.ru www.riks-s.ru 92.118.91.101;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    include /srv/riks/app/deploy/nginx-site.inc;
}
