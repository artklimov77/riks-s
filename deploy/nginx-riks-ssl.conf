# Рикс+С — nginx с HTTPS (/etc/nginx/conf.d/riks.conf ставит deploy/https.sh после выпуска сертификата).
# Главный адрес — https://www.riks-s.ru; http и riks-s.ru без www перенаправляются туда.

map $sent_http_content_type $riks_cache {
    default                    "no-cache";
    ~^image/                   "public, max-age=2592000";
    ~^font/                    "public, max-age=2592000";
}

server {
    listen 80;
    listen [::]:80;
    server_name riks-s.ru www.riks-s.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 301 https://www.riks-s.ru$request_uri; }
}

# по IP — сайт без HTTPS (для проверки)
server {
    listen 80;
    listen [::]:80;
    server_name 92.118.91.101;
    include /srv/riks/app/deploy/nginx-site.inc;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name riks-s.ru;
    ssl_certificate     /etc/letsencrypt/live/riks-s.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/riks-s.ru/privkey.pem;
    return 301 https://www.riks-s.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.riks-s.ru;
    ssl_certificate     /etc/letsencrypt/live/riks-s.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/riks-s.ru/privkey.pem;
    ssl_session_cache shared:riks_ssl:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /srv/riks/app/deploy/nginx-site.inc;
}
