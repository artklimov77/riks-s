<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заявки — Рикс+С</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  body{min-height:100vh}
  .dash{max-width:1100px;margin:0 auto;padding:40px 24px 80px}
  .dash h1{font-weight:900;font-size:clamp(30px,4vw,44px);letter-spacing:-.03em}
  .dash .sub{color:var(--muted);margin-top:6px}
  .gate{max-width:360px;margin:14vh auto;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:30px;text-align:center}
  .gate h2{font-weight:800;font-size:22px}
  .gate input{width:100%;height:52px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--paper);padding:0 16px;font-size:16px;margin-top:16px;outline:none}
  .gate input:focus{border-color:var(--ink)}
  .gate button{width:100%;height:52px;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;margin-top:12px}
  .gate .err{color:#C8102E;font-size:14px;margin-top:10px;min-height:18px}
  .stat-row{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0}
  .stat{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px 18px;min-width:120px}
  .stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em}
  .stat span{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .toolbar .fb{height:38px;padding:0 14px;border-radius:9px;border:1.5px solid var(--line-2);font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
  .toolbar .fb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .toolbar .rf{margin-left:auto;height:38px;padding:0 14px;border-radius:9px;border:1.5px solid var(--ink);font-weight:700;font-size:13px;cursor:pointer;background:none}
  .lead-card{display:grid;grid-template-columns:1.3fr 1fr 1.2fr .9fr auto;gap:14px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:8px}
  .lead-card .nm{font-weight:700}
  .lead-card .nm small{display:block;font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
  .lead-card a.ph{font-family:var(--mono);font-weight:600;font-size:15px}
  .lead-card .srv{font-size:14px;color:var(--muted)}
  .badge{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px;background:var(--y);color:var(--ink)}
  .lead-card .tm{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
  .empty{text-align:center;color:var(--muted);padding:60px 0}
  .note{background:#FFFBEA;border:1px solid var(--line-2);border-radius:12px;padding:16px 18px;font-size:14px;color:var(--muted);margin-bottom:20px}
  @media (max-width:800px){.lead-card{grid-template-columns:1fr 1fr;row-gap:8px}.lead-card .tm{text-align:left}}
</style>
</head>
<body>

<div class="gate" id="gate">
  <h2>Заявки Рикс+С</h2>
  <p class="sub" style="color:var(--muted);font-size:14px;margin-top:8px">Внутренняя страница. Введите пароль.</p>
  <input type="password" id="pass" placeholder="Пароль" autocomplete="current-password">
  <button id="enter">Войти</button>
  <div class="err" id="err"></div>
</div>

<div class="dash" id="dash" style="display:none">
  <h1>Заявки с сайта</h1>
  <p class="sub">Все обращения с форм сайта и конструктора. Обновляется при открытии.</p>
  <div class="note" id="note" style="display:none"></div>
  <div class="stat-row" id="stats"></div>
  <div class="toolbar">
    <div id="filters" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    <button class="rf" id="refresh">↻ Обновить</button>
  </div>
  <div id="list"></div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const gate = $('#gate'), dash = $('#dash');
  let all = [], curCat = 'all';

  const catOf = src => {
    src = (src || '').toLowerCase();
    if (src.includes('avito')) return 'Авито';
    if (src.includes('vk') || src.includes('вконтакт')) return 'ВКонтакте';
    if (src.includes('t.me') || src.includes('telegram')) return 'Telegram';
    if (src.includes('yandex') || src.includes('карт') || src.includes('maps')) return 'Яндекс';
    if (src.includes('google')) return 'Google';
    if (src.includes('реферал') || src.includes('ref')) return 'Реферал';
    return 'Сайт / прямой';
  };

  const render = () => {
    const list = $('#list'), filters = $('#filters'), stats = $('#stats');
    const byCat = {};
    all.forEach(l => { const c = catOf(l.source); byCat[c] = (byCat[c] || 0) + 1; });
    stats.innerHTML = '<div class="stat"><b>' + all.length + '</b><span>всего заявок</span></div>' +
      Object.entries(byCat).map(([c, n]) => '<div class="stat"><b>' + n + '</b><span>' + c + '</span></div>').join('');
    const cats = ['all', ...Object.keys(byCat)];
    filters.innerHTML = cats.map(c => '<button class="fb' + (c === curCat ? ' on' : '') + '" data-c="' + c + '">' + (c === 'all' ? 'Все' : c) + '</button>').join('');
    filters.querySelectorAll('.fb').forEach(b => b.onclick = () => { curCat = b.dataset.c; render(); });
    const rows = all.filter(l => curCat === 'all' || catOf(l.source) === curCat);
    if (!rows.length) { list.innerHTML = '<div class="empty">Пока нет заявок в этой категории.</div>'; return; }
    list.innerHTML = rows.map(l => {
      let tm = l.ts; try { tm = new Date(l.ts).toLocaleString('ru-RU', { timeZone: 'Europe/Moscow' }); } catch (e) {}
      const tel = (l.phone || '').replace(/[^\d+]/g, '');
      return '<div class="lead-card">' +
        '<div class="nm">' + (esc(l.name) || '—') + (l.detail ? '<small>' + esc(l.detail) + '</small>' : '') + '</div>' +
        '<div><a class="ph" href="tel:' + tel + '">' + esc(l.phone) + '</a></div>' +
        '<div class="srv">' + (esc(l.service) || '—') + '</div>' +
        '<div><span class="badge">' + catOf(l.source) + '</span><div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px">' + esc(l.source) + '</div></div>' +
        '<div class="tm">' + tm + '<br>' + esc(l.page) + '</div>' +
        '</div>';
    }).join('');
  };

  const esc = s => String(s == null ? '' : s).replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));

  const load = async (pass) => {
    const r = await fetch('/api/leads?pass=' + encodeURIComponent(pass));
    if (r.status === 401) throw new Error('auth');
    const j = await r.json();
    all = (j.leads || []);
    if (j.note === 'storage-not-configured') {
      $('#note').style.display = 'block';
      $('#note').textContent = 'Хранилище лидов (Upstash) ещё не подключено — заявки сейчас приходят только в Telegram. Подключите хранилище, чтобы список наполнялся здесь.';
    }
    render();
  };

  const enter = async () => {
    const p = $('#pass').value.trim();
    if (!p) return;
    try {
      await load(p);
      try { localStorage.setItem('riks_leads_pass', p); } catch (e) {}
      gate.style.display = 'none'; dash.style.display = 'block';
    } catch (e) { $('#err').textContent = 'Неверный пароль или хранилище недоступно.'; }
  };

  $('#enter').onclick = enter;
  $('#pass').addEventListener('keydown', e => { if (e.key === 'Enter') enter(); });
  $('#refresh').onclick = () => { const p = localStorage.getItem('riks_leads_pass') || ''; load(p).catch(() => {}); };

  // автологин, если пароль сохранён
  let saved = ''; try { saved = localStorage.getItem('riks_leads_pass') || ''; } catch (e) {}
  if (saved) load(saved).then(() => { gate.style.display = 'none'; dash.style.display = 'block'; }).catch(() => {});
})();
</script>
</body>
</html>
