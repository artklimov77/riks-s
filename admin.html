<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рикс+С — CRM</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --b-blue:#2a8add; --b-blue2:#27b4e8; --b-blue-d:#1a6db5;
    --bg:#eef2f4; --panel:#fff; --line:#e3e7ec; --line2:#d5dde3;
    --ink:#333; --muted:#6a7681; --muted2:#9aa7b2;
    --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Open Sans',system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit}

  .gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--b-blue),var(--b-blue2));z-index:100}
  .gate .box{background:#fff;border-radius:10px;padding:34px 30px;width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .gate .logo{font-weight:700;font-size:22px;color:var(--b-blue-d)}.gate .logo b{color:#ff5752}
  .gate p{color:var(--muted);font-size:13px;margin:6px 0 18px}
  .gate input{width:100%;height:46px;border:1.5px solid var(--line2);border-radius:7px;padding:0 14px;font-size:15px;outline:none}
  .gate input:focus{border-color:var(--b-blue)}
  .gate button{width:100%;height:46px;border-radius:7px;background:var(--b-blue);color:#fff;font-weight:600;font-size:15px;margin-top:12px}
  .gate .err{color:#ff5752;font-size:13px;min-height:18px;margin-top:10px}

  .app{display:none;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:40;height:54px;background:linear-gradient(90deg,var(--b-blue),var(--b-blue2));display:flex;align-items:center;gap:16px;padding:0 18px;color:#fff}
  .topbar .brand{font-weight:700;font-size:17px;white-space:nowrap}
  .topbar .search{flex:1;max-width:460px}
  .topbar .search input{width:100%;height:34px;border:none;border-radius:6px;padding:0 14px;font-size:14px;outline:none;background:rgba(255,255,255,.95)}
  .topbar .sp{flex:1}
  .topbar .tb-btn{color:#fff;font-size:13px;font-weight:600;padding:7px 12px;border-radius:6px;background:rgba(255,255,255,.16)}
  .topbar .tb-btn:hover{background:rgba(255,255,255,.28)}
  .topbar .ava{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--b-blue-d);font-weight:700;display:flex;align-items:center;justify-content:center}

  .body{display:flex;align-items:flex-start}
  .side{width:220px;flex:0 0 220px;background:var(--panel);border-right:1px solid var(--line);min-height:calc(100vh - 54px);position:sticky;top:54px}
  .side .grp{padding:10px 0;border-bottom:1px solid var(--line)}
  .side .gt{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted2);padding:6px 18px 4px;font-weight:700}
  .side .nav{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:14px;color:#404a54;border-left:3px solid transparent;cursor:pointer}
  .side .nav .ic{width:18px;text-align:center;font-size:15px}
  .side .nav:hover{background:#f5f8fa}
  .side .nav.on{background:#eaf5fd;border-left-color:var(--b-blue);color:var(--b-blue-d);font-weight:600}
  .side .nav .cnt{margin-left:auto;background:#ff5752;color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}

  .main{flex:1;min-width:0;padding:18px 20px 60px}
  .page-h{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .page-h h1{font-size:22px;font-weight:700}
  .tabs{display:flex;gap:4px;background:#e2e8ec;border-radius:8px;padding:3px}
  .tabs button{padding:7px 16px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  .btn-pri{background:var(--b-blue);color:#fff;font-weight:600;font-size:13px;border-radius:7px;padding:9px 16px}
  .btn-pri:hover{background:var(--b-blue-d)}
  .btn-sec{border:1.5px solid var(--b-blue);color:var(--b-blue-d);font-weight:600;font-size:13px;border-radius:7px;padding:8px 14px;background:#fff}
  .spacer{margin-left:auto}

  .note{background:#fff8e1;border:1px solid #ffe0a3;color:#8a6d00;border-radius:8px;padding:12px 16px;font-size:13px;margin-bottom:14px}

  .kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
  .col{flex:0 0 244px;width:244px;background:#e7edf1;border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 200px)}
  .col.drag-over{outline:2px dashed var(--b-blue);outline-offset:-2px}
  .col .ch{padding:10px 12px 8px;border-radius:10px 10px 0 0;color:#fff}
  .col .ch .cn{font-weight:700;font-size:13px}
  .col .ch .cm{font-size:11px;opacity:.92;margin-top:2px}
  .col .cards{padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:40px}
  .card{background:#fff;border-radius:8px;padding:10px 11px;box-shadow:var(--shadow);cursor:pointer;border-left:3px solid var(--line2)}
  .card:hover{box-shadow:0 2px 8px rgba(0,0,0,.14)}
  .card.dragging{opacity:.4}
  .card .nm{font-weight:700;font-size:13px}
  .card .ph{font-size:13px;color:var(--b-blue-d);font-weight:600;margin-top:2px}
  .card .sv{font-size:12px;color:var(--muted);margin-top:4px}
  .card .sum{font-weight:700;font-size:14px;margin-top:6px}
  .card .rem{font-size:11px;color:#c0392b;margin-top:1px}
  .card .meta{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
  .badge{font-size:10px;font-weight:700;padding:3px 7px;border-radius:4px;color:#fff;white-space:nowrap}
  .tag{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;background:#eef2f4;color:var(--muted)}
  .card .tm{font-size:10px;color:var(--muted2);margin-left:auto}

  .table{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto}
  .table table{width:100%;border-collapse:collapse;min-width:640px}
  .table th{background:#f5f8fa;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);font-weight:700}
  .table td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  .table tr:last-child td{border-bottom:none}
  .table tr:hover td{background:#f8fbfd}
  .table .nm{font-weight:700}
  .table .ph{color:var(--b-blue-d);font-weight:600}
  .st-pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:12px;color:#fff;display:inline-block}
  .cat-h{font-weight:700;font-size:14px;margin:18px 0 8px;color:var(--b-blue-d)}
  .inp{height:36px;border:1.5px solid var(--line2);border-radius:6px;padding:0 10px;font-size:13px;outline:none;width:100%;background:#fff}
  .inp:focus{border-color:var(--b-blue)}
  td .inp{height:32px}
  .ic-btn{width:32px;height:32px;border-radius:6px;font-size:15px;color:var(--muted)}
  .ic-btn:hover{background:#eef2f4}
  .ic-btn.del:hover{background:#ffe9e9;color:#ff5752}

  .cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .kpi b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em}
  .kpi span{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
  .chart{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
  .chart h3{font-size:14px;font-weight:700;margin-bottom:14px}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .bar-row .bl{width:130px;font-size:12px;color:var(--muted);text-align:right;flex:0 0 130px}
  .bar-row .bt{flex:1;background:#eef2f4;border-radius:5px;height:22px;overflow:hidden}
  .bar-row .bf{height:100%;border-radius:5px;display:flex;align-items:center;padding:0 8px;color:#fff;font-size:11px;font-weight:700;min-width:30px;white-space:nowrap}
  .funnel{display:flex;gap:8px;flex-wrap:wrap}
  .funnel .fstep{flex:1;min-width:92px;text-align:center;padding:12px 6px;border-radius:8px;color:#fff}
  .funnel .fstep b{display:block;font-size:20px;font-weight:700}
  .funnel .fstep span{font-size:11px;font-weight:600;opacity:.95;display:block}
  .funnel .fstep .fm{font-size:11px;font-weight:700;margin-top:3px;background:rgba(255,255,255,.22);border-radius:4px;padding:1px 0}
  .empty{text-align:center;color:var(--muted);padding:50px 0}

  .scrim{position:fixed;inset:0;background:rgba(20,30,40,.4);z-index:60;display:none}
  .scrim.on{display:block}
  .drawer{position:fixed;top:0;right:0;height:100%;width:430px;max-width:94vw;background:#fff;z-index:70;transform:translateX(100%);transition:transform .22s ease;box-shadow:-8px 0 30px rgba(0,0,0,.2);display:flex;flex-direction:column}
  .drawer.on{transform:translateX(0)}
  .drawer .dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
  .drawer .dh .nm{font-size:19px;font-weight:700}
  .drawer .dh .x{margin-left:auto;font-size:22px;color:var(--muted);line-height:1}
  .drawer .dc{padding:18px 20px;overflow-y:auto;flex:1}
  .fld{margin-bottom:13px}
  .fld .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted2);font-weight:700;margin-bottom:4px}
  .fld .v{font-size:14px}.fld .v a{color:var(--b-blue-d);font-weight:600}
  .stages{display:flex;flex-wrap:wrap;gap:6px}
  .stages button{font-size:12px;font-weight:600;padding:7px 11px;border-radius:6px;border:1.5px solid var(--line2);color:var(--muted);background:#fff}
  .stages button.on{color:#fff;border-color:transparent}
  textarea.inp{height:auto;min-height:70px;padding:10px 12px;resize:vertical}
  .drawer .df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px}
  .drawer .df .call{flex:1;height:44px;border-radius:7px;background:#9dcf00;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px}
  .drawer .df .save{flex:1;height:44px;border-radius:7px;background:var(--b-blue);color:#fff;font-weight:700;font-size:14px}
  .linkbox{background:#eaf5fd;border:1px solid #cde6f8;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:13px}
  .linkbox a{color:var(--b-blue-d);font-weight:700}

  .modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.98);width:620px;max-width:95vw;max-height:92vh;background:#fff;border-radius:12px;z-index:80;display:none;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.3)}
  .modal.on{display:flex;transform:translate(-50%,-50%) scale(1)}
  .modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
  .modal .mh h2{font-size:18px;font-weight:700}
  .modal .mh .x{margin-left:auto;font-size:22px;color:var(--muted)}
  .modal .mb{padding:18px 20px;overflow-y:auto}
  .modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .items .it{border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;background:#fafcfd}
  .items .it .r1{display:flex;gap:8px;align-items:center}
  .items .it .r2{display:grid;grid-template-columns:1fr 70px 96px 92px 34px;gap:8px;align-items:center;margin-top:7px}
  .items .it .sm{font-size:10px;color:var(--muted2);font-weight:700;text-transform:uppercase}
  .it-sum{text-align:right;font-weight:700;white-space:nowrap;font-size:13px}
  .totals{margin-top:10px;text-align:right;font-size:13px;line-height:1.7}
  .totals .big{font-size:19px;font-weight:700}
  .totals .rem{color:#c0392b;font-weight:700}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:#fff;padding:11px 20px;border-radius:8px;font-size:13px;z-index:95;opacity:0;transition:.2s;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:720px){.side{display:none}.topbar .search{max-width:none}.grid2,.grid3{grid-template-columns:1fr}.items .it .r2{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="box">
    <div class="logo">Рикс<b>+</b>С · CRM</div>
    <p>Внутренняя панель. Введите пароль.</p>
    <input type="password" id="pass" placeholder="Пароль" autocomplete="current-password">
    <button id="enter">Войти</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div class="app" id="app">
  <div class="topbar">
    <div class="brand">Рикс<b>+</b>С</div>
    <div class="search"><input id="q" type="search" placeholder="Поиск по имени, телефону, услуге…"></div>
    <div class="sp"></div>
    <button class="tb-btn" id="exit">Выход</button>
    <div class="ava">Р</div>
  </div>
  <div class="body">
    <aside class="side">
      <div class="grp">
        <div class="gt">Продажи</div>
        <div class="nav on" data-view="leads"><span class="ic">▦</span> Лиды · Воронка <span class="cnt" id="navCnt" style="display:none"></span></div>
        <div class="nav" data-view="leadlist"><span class="ic">☰</span> Лиды · Список</div>
        <div class="nav" data-view="deals"><span class="ic">💼</span> Сделки</div>
      </div>
      <div class="grp">
        <div class="gt">Каталог</div>
        <div class="nav" data-view="catalog"><span class="ic">₽</span> Прайс / услуги</div>
      </div>
      <div class="grp">
        <div class="gt">Отчёты</div>
        <div class="nav" data-view="analytics"><span class="ic">📊</span> Аналитика</div>
        <div class="nav" data-view="channels"><span class="ic">🔌</span> Источники</div>
      </div>
      <div class="grp">
        <div class="gt">Система</div>
        <div class="nav" data-view="settings"><span class="ic">⚙️</span> Настройка</div>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<div class="drawer" id="drawer">
  <div class="dh"><div><div class="nm" id="dNm">—</div><div style="color:var(--muted);font-size:13px" id="dSub"></div></div><button class="x" id="dClose">&times;</button></div>
  <div class="dc" id="dBody"></div>
  <div class="df"><a class="call" id="dCall">📞 Позвонить</a><button class="save" id="dSave">Сохранить</button></div>
</div>

<div class="modal" id="modal">
  <div class="mh"><h2 id="mTitle">—</h2><button class="x" id="mClose">&times;</button></div>
  <div class="mb" id="mBody"></div>
  <div class="mf"><span id="mInfo" style="margin-right:auto;color:var(--muted);font-size:12px"></span><button class="btn-sec" id="mCancel">Отмена</button><button class="btn-pri" id="mSave">Сохранить</button></div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  const genId = () => (Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8));
  const money = n => (Math.round(Number(n)||0)).toLocaleString('ru-RU')+' ₽';
  const fmt = ts => { try { return new Date(ts).toLocaleString('ru-RU',{timeZone:'Europe/Moscow',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); } catch(e){ return ts||''; } };
  const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1900); };

  // Лид = квалификация (без денег). Сделка = деньги/производство.
  const LEAD_STAGES=[
    {k:'new',t:'Новая',col:'#55d0e0'},{k:'work',t:'В работе',col:'#2fc6f6'},
    {k:'won',t:'В сделке',col:'#9dcf00'},{k:'lost',t:'Отказ',col:'#ff5752'}];
  const DEAL_STAGES=[
    {k:'new',t:'Новая',col:'#55d0e0'},{k:'kp',t:'Замер / КП',col:'#ffa900'},
    {k:'contract',t:'Договор',col:'#a673e8'},{k:'prod',t:'Производство',col:'#2fc6f6'},
    {k:'ready',t:'Готов',col:'#16b5c6'},{k:'paid',t:'Оплачен',col:'#9dcf00'},
    {k:'lost',t:'Отказ',col:'#ff5752'}];
  const stOf=(arr,k)=>arr.find(s=>s.k===k)||arr[0];

  const SRC=[
    {re:/avito|авито/i,t:'Авито',c:'#0a8f3c'},{re:/vk|вконтакт/i,t:'ВКонтакте',c:'#2787f5'},
    {re:/t\.me|telegram|телеграм/i,t:'Telegram',c:'#29a9eb'},{re:/yandex|яндекс|карт|maps/i,t:'Яндекс',c:'#ff3d00'},
    {re:/2gis|2гис/i,t:'2ГИС',c:'#39c936'},{re:/google/i,t:'Google',c:'#4285f4'},
    {re:/реферал|ref|qr|повтор/i,t:'Реферал',c:'#8e44ad'},{re:/звон|тел|phone/i,t:'Звонок',c:'#e67e22'},
    {re:/офис|визит|пришёл|пришел|адрес/i,t:'Офис / визит',c:'#16a085'}];
  const srcOf=s=>{s=(s||'');for(const x of SRC)if(x.re.test(s))return x;return {t:'Сайт / прямой',c:'#6b7a8d'};};
  const SRC_OPTS=['Звонок','Офис / визит','Сайт','Авито','ВКонтакте','Telegram','Яндекс Карты','2ГИС','Реферал','Повторный'];
  const CATS=['Вывески','Неон','Транспорт','Полиграфия','Стенды','Печать','Прочее'];
  const UNITS=['шт','м²','п.м.','компл.','услуга'];

  let PASS='', DEMO=false, VIEW='leads', Q='';
  const DATA={leads:[],deals:[],catalog:[]};

  /* ---------- API (коллекция сделок хранится как 'orders') ---------- */
  const COL={leads:'leads',deals:'orders',catalog:'catalog'};
  async function api(op,col,extra){
    if(DEMO) return {ok:true,demo:true};
    const r=await fetch('/api/db',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({pass:PASS,op,col:COL[col]||col},extra||{}))});
    if(r.status===401) throw new Error('auth');
    return r.json();
  }
  async function loadAll(){
    if(DEMO){ render(); return; }
    const [l,o,c]=await Promise.all([api('list','leads'),api('list','deals'),api('list','catalog')]);
    DATA.leads=l.items||[]; DATA.deals=o.items||[]; DATA.catalog=c.items||[];
    DATA._nostore=(l.note==='storage-not-configured');
    if(!DATA._nostore && !DATA.catalog.length){ const s=await api('seedCatalog','catalog'); if(s.items)DATA.catalog=s.items; }
    render();
  }
  async function save(col,rec){
    if(DEMO){ toast('Демо: сохранение отключено'); return rec; }
    const r=await api('save',col,{data:rec});
    if(r.ok) return r.item||rec;
    toast(r.note==='storage-not-configured'?'Подключите Upstash Redis в Vercel':'Не сохранилось'); throw new Error('save');
  }
  async function remove(col,id){ if(DEMO){toast('Демо: удаление отключено');return;} const r=await api('delete',col,{id}); if(!r.ok)toast('Не удалилось'); }

  const filt = arr => { const q=Q.trim().toLowerCase(); if(!q)return arr; return arr.filter(x=>JSON.stringify(x).toLowerCase().includes(q)); };
  const dealOf = id => DATA.deals.find(d=>d.id===id);
  const dealTotal = d => (d.items||[]).reduce((a,i)=>a+(Number(i.qty)||0)*(Number(i.price)||0),0);

  /* ---------- render switch ---------- */
  function render(){

  /* ---------- CATALOG ---------- */
  function catalogView(){

  function catRow(i){

      '<td><input class="inp f-name" value="'+esc(i.name)+'"></td>'+

  function wireCatalog(){
    $('#catWrap').querySelectorAll('tr[data-id]').forEach(tr=>{
      const id=tr.dataset.id;
      tr.querySelector('.save').onclick=async()=>{
        const rec={id,name:tr.querySelector('.f-name').value.trim(),category:tr.querySelector('.f-cat').value,unit:tr.querySelector('.f-unit').value,price:Number(tr.querySelector('.f-price').value)||0,ts:(DATA.catalog.find(x=>x.id===id)||{}).ts};
        if(!rec.name){toast('Введите название');return;}
        try{const it=await save('catalog',rec);const i=DATA.catalog.findIndex(x=>x.id===id);if(i>=0)DATA.catalog[i]=it;else DATA.catalog.push(it);toast('Сохранено');}catch(e){}
      };
      tr.querySelector('.del').onclick=async()=>{ if(!confirm('Удалить позицию?'))return; await remove('catalog',id); DATA.catalog=DATA.catalog.filter(x=>x.id!==id); catalogView(); };
    });
  }
  function addCatalogRow(){ DATA.catalog.unshift({id:genId(),name:'',category:'Вывески',unit:'шт',price:0,ts:new Date().toISOString()}); catalogView(); }

  /* ---------- ANALYTICS (правильный подсчёт) ---------- */
  function analyticsView(){
    const L=DATA.leads,D=DATA.deals;
    const converted=L.filter(l=>l.dealId||l.stage==='won').length;
    const conv=L.length?Math.round(converted/L.length*100):0;
    const paid=D.filter(d=>d.status==='paid');
    const revenue=paid.reduce((a,d)=>a+dealTotal(d),0);
    const pipeline=D.filter(d=>d.status!=='paid'&&d.status!=='lost').reduce((a,d)=>a+dealTotal(d),0);
    const avg=paid.length?Math.round(revenue/paid.length):0;
    const advances=D.filter(d=>d.status!=='paid'&&d.status!=='lost').reduce((a,d)=>a+(Number(d.prepaid)||0),0);
    const cash=revenue+advances;

    const leadsBySrc={}; L.forEach(l=>{const t=srcOf(l.source).t;leadsBySrc[t]=(leadsBySrc[t]||0)+1;});
    const revBySrc={}; paid.forEach(d=>{const t=srcOf(d.source).t;revBySrc[t]=(revBySrc[t]||0)+dealTotal(d);});
    const maxLead=Math.max(1,...Object.values(leadsBySrc)), maxRev=Math.max(1,...Object.values(revBySrc),1);

    const kpis='<div class="cards-row">'+
      '<div class="kpi"><b>'+L.length+'</b><span>Лидов</span></div>'+
      '<div class="kpi"><b>'+conv+'%</b><span>Конверсия в сделку</span></div>'+
      '<div class="kpi"><b>'+D.length+'</b><span>Сделок</span></div>'+
      '<div class="kpi"><b>'+money(pipeline)+'</b><span>В работе</span></div>'+
      '<div class="kpi"><b>'+money(revenue)+'</b><span>Выручка (оплачено)</span></div>'+
      '<div class="kpi"><b>'+money(advances)+'</b><span>Получено авансов</span></div>'+
      '<div class="kpi" title="Выручка + авансы по незакрытым сделкам — реальный кэш в кассе"><b>'+money(cash)+'</b><span>Деньги на руках</span></div>'+
      '<div class="kpi"><b>'+money(avg)+'</b><span>Средний чек</span></div></div>';

    const leadBars=Object.entries(leadsBySrc).sort((a,b)=>b[1]-a[1]).map(([t,n])=>{const c=(SRC.find(x=>x.t===t)||{c:'#6b7a8d'}).c;
      return '<div class="bar-row"><div class="bl">'+t+'</div><div class="bt"><div class="bf" style="width:'+Math.max(8,n/maxLead*100)+'%;background:'+c+'">'+n+'</div></div></div>';}).join('')||'<div class="empty">Нет данных</div>';
    const revBars=Object.entries(revBySrc).sort((a,b)=>b[1]-a[1]).map(([t,v])=>{const c=(SRC.find(x=>x.t===t)||{c:'#6b7a8d'}).c;
      return '<div class="bar-row"><div class="bl">'+t+'</div><div class="bt"><div class="bf" style="width:'+Math.max(10,v/maxRev*100)+'%;background:'+c+'">'+money(v)+'</div></div></div>';}).join('')||'<div class="empty">Пока нет оплаченных сделок</div>';

    const byStage={}; DEAL_STAGES.forEach(s=>byStage[s.k]={n:0,sum:0}); D.forEach(d=>{const st=d.status||'new';if(byStage[st]){byStage[st].n++;byStage[st].sum+=dealTotal(d);}});
    const funnel='<div class="funnel">'+DEAL_STAGES.map(s=>'<div class="fstep" style="background:'+s.col+'"><b>'+byStage[s.k].n+'</b><span>'+s.t+'</span><div class="fm">'+money(byStage[s.k].sum)+'</div></div>').join('')+'</div>';

    $('#main').innerHTML=head('Аналитика',refreshBtn)+storeNote()+kpis+
      '<div class="chart"><h3>💰 Деньги по источникам (оплаченные сделки)</h3>'+revBars+'<p style="color:var(--muted);font-size:12px;margin-top:8px">Главный отчёт: какой канал приносит реальные деньги, а не просто заявки.</p></div>'+
      '<div class="chart"><h3>Лиды по источникам (заявки)</h3>'+leadBars+'</div>'+
      '<div class="chart"><h3>Воронка сделок</h3>'+funnel+'</div>';
    bindCommon();
  }

  /* ---------- drag & drop ---------- */
  function bindDnD(col,stages){
    let dragId=null;
    document.querySelectorAll('.card').forEach(c=>{
      c.addEventListener('dragstart',e=>{dragId=c.dataset.id;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
      c.addEventListener('dragend',()=>{dragId=null;c.classList.remove('dragging');document.querySelectorAll('.col').forEach(x=>x.classList.remove('drag-over'));});
      c.addEventListener('click',()=>{ if(!c.classList.contains('dragging')){ col==='leads'?openLead(c.dataset.id):editDeal(c.dataset.id,null);} });
    });
    document.querySelectorAll('.col').forEach(cl=>{
      cl.addEventListener('dragover',e=>{e.preventDefault();cl.classList.add('drag-over');});
      cl.addEventListener('dragleave',()=>cl.classList.remove('drag-over'));
      cl.addEventListener('drop',async e=>{e.preventDefault();cl.classList.remove('drag-over');
        const k=cl.dataset.stage; if(!dragId||!k)return;
        if(col==='leads'){ const l=DATA.leads.find(x=>x.id===dragId); if(!l)return; l.stage=k; render(); try{await save('leads',l);toast(stOf(stages,k).t);}catch(e){} }
        else { const d=DATA.deals.find(x=>x.id===dragId); if(!d)return; d.status=k; render(); try{await save('deals',d);toast(stOf(stages,k).t);}catch(e){} }
      });
    });
  }

  /* ---------- lead drawer ---------- */
  let curLead=null,draftStage='new';

    const s=srcOf(l.source), tel=(l.phone||'').replace(/[^\d+]/g,''), d=l.dealId?dealOf(l.dealId):null;
    $('#dNm').textContent=l.name||'Без имени'; $('#dSub').textContent=l.service||''; $('#dCall').href='tel:'+tel;
    $('#dBody').innerHTML=
      (d?'<div class="linkbox">💼 Создана сделка на '+money(dealTotal(d))+' · <a id="dGoDeal">открыть сделку →</a></div>':'')+
      '<div class="fld"><div class="k">Телефон</div><div class="v"><a href="tel:'+tel+'">'+esc(l.phone)+'</a></div></div>'+
      (l.detail?'<div class="fld"><div class="k">Что хочет (со слов клиента)</div><div class="v">'+esc(l.detail)+'</div></div>':'')+
      '<div class="fld"><div class="k">Источник</div><div class="v"><span class="badge" style="background:'+s.c+'">'+s.t+'</span> <span style="color:var(--muted);font-size:12px">'+esc(l.source||'—')+'</span></div></div>'+
      '<div class="fld"><div class="k">Страница</div><div class="v">'+esc(l.page||'—')+'</div></div>'+
      '<div class="fld"><div class="k">Когда</div><div class="v">'+fmt(l.ts)+'</div></div>'+
      '<div class="fld"><div class="k">Стадия</div><div class="stages" id="dStages">'+
        LEAD_STAGES.map(st=>'<button data-k="'+st.k+'" style="'+(st.k===draftStage?'background:'+st.col+';color:#fff;border-color:transparent':'')+'">'+st.t+'</button>').join('')+'</div></div>'+
      '<div class="fld"><div class="k">Заметка менеджера</div><textarea class="inp" id="dNote" placeholder="Что обсудили…">'+esc(l.note||'')+'</textarea></div>'+
      '<div class="fld">'+(d?'':'<button class="btn-pri" id="dMakeDeal" style="width:100%;padding:12px">💼 Создать сделку из лида</button>')+'</div>'+
      '<div class="fld"><button class="btn-sec" id="dEdit">✎ Редактировать</button> <button class="btn-sec" id="dDel" style="border-color:#f2b8b8;color:#ff5752">Удалить</button></div>';
    $('#dStages').querySelectorAll('button').forEach(b=>b.onclick=()=>{draftStage=b.dataset.k;
      $('#dStages').querySelectorAll('button').forEach(x=>{const st=stOf(LEAD_STAGES,x.dataset.k);const on=x.dataset.k===draftStage;x.style.background=on?st.col:'';x.style.color=on?'#fff':'';x.style.borderColor=on?'transparent':'';});});
    if(d)$('#dGoDeal').onclick=()=>{closeDrawer();VIEW='deals';render();editDeal(d.id,null);};
    const mk=$('#dMakeDeal'); if(mk)mk.onclick=()=>{closeDrawer();editDeal(null,l);};
    $('#dEdit').onclick=()=>{closeDrawer();editLead(l);};
    $('#dDel').onclick=async()=>{ if(!confirm('Удалить лид?'))return; await remove('leads',l.id); DATA.leads=DATA.leads.filter(x=>x.id!==l.id); closeDrawer(); render(); };
    $('#scrim').classList.add('on'); $('#drawer').classList.add('on');
  }
  function closeDrawer(){ $('#drawer').classList.remove('on'); if(!$('#modal').classList.contains('on'))$('#scrim').classList.remove('on'); curLead=null; }
  $('#dClose').onclick=closeDrawer;

  function showModal(title,html){ $('#mTitle').textContent=title; $('#mInfo').textContent=''; $('#mBody').innerHTML=html; $('#scrim').classList.add('on'); $('#modal').classList.add('on'); }
  function hideModal(){ $('#modal').classList.remove('on'); if(!$('#drawer').classList.contains('on'))$('#scrim').classList.remove('on'); $('#mSave').onclick=null; }

  /* ---------- lead editor ---------- */
  function editLead(l){
    const e=l||{}; const isNew=!l;
    showModal(isNew?'Новый лид':'Редактировать лид',
      '<div class="grid2">'+
      '<div class="fld"><div class="k">Имя</div><input class="inp" id="e_name" value="'+esc(e.name||'')+'"></div>'+
      '<div class="fld"><div class="k">Телефон *</div><input class="inp" id="e_phone" value="'+esc(e.phone||'')+'" placeholder="+7 …"></div></div>'+
      '<div class="fld"><div class="k">Что хочет (кратко)</div><input class="inp" id="e_service" value="'+esc(e.service||'')+'" placeholder="напр. визитки"></div>'+
      '<div class="fld"><div class="k">Комментарий</div><textarea class="inp" id="e_detail">'+esc(e.detail||'')+'</textarea></div>'+
      '<div class="grid2">'+
      '<div class="fld"><div class="k">Источник</div><select class="inp" id="e_source">'+SRC_OPTS.map(o=>'<option'+(o===(e.source||'Звонок')?' selected':'')+'>'+o+'</option>').join('')+'</select></div>'+
      '<div class="fld"><div class="k">Стадия</div><select class="inp" id="e_stage">'+LEAD_STAGES.map(s=>'<option value="'+s.k+'"'+(s.k===(e.stage||'new')?' selected':'')+'>'+s.t+'</option>').join('')+'</select></div></div>');
    $('#mSave').onclick=async()=>{
      const phone=$('#e_phone').value.trim(); if(!phone.replace(/\D/g,'')){toast('Введите телефон');return;}
      const rec=Object.assign({},e,{id:e.id||genId(),name:$('#e_name').value.trim(),phone,service:$('#e_service').value.trim(),detail:$('#e_detail').value.trim(),source:$('#e_source').value,stage:$('#e_stage').value,note:e.note||'',page:e.page||'вручную',ts:e.ts||new Date().toISOString()});
      try{const it=await save('leads',rec);const i=DATA.leads.findIndex(x=>x.id===rec.id);if(i>=0)DATA.leads[i]=it;else DATA.leads.unshift(it);toast('Лид сохранён');hideModal();render();}catch(err){}
    };
  }

  /* ---------- deal editor (create/edit, можно из лида) ---------- */
  function editDeal(id, fromLead){
    const d=id?dealOf(id):null; const e=d||{};
    // префилл из лида
    if(fromLead && !id){ e.client=fromLead.name; e.phone=fromLead.phone; e.source=srcOf(fromLead.source).t; e.leadId=fromLead.id; e.note=fromLead.detail?('Запрос: '+fromLead.detail):''; }
    const items=(e.items||[]).map(x=>Object.assign({},x));
    if(!items.length) items.push({name:'',spec:'',unit:'шт',qty:1,price:0});
    const catOpts='<option value="">— выбрать из прайса —</option>'+DATA.catalog.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+' ('+money(c.price)+'/'+esc(c.unit||'шт')+')</option>').join('');
    const srcVal=e.source||'CRM';
    showModal(id?'Сделка':'Новая сделка',
      '<div class="grid2">'+
      '<div class="fld"><div class="k">Клиент</div><input class="inp" id="o_client" value="'+esc(e.client||'')+'"></div>'+
      '<div class="fld"><div class="k">Телефон</div><input class="inp" id="o_phone" value="'+esc(e.phone||'')+'"></div></div>'+
      '<div class="grid3">'+
      '<div class="fld"><div class="k">Статус</div><select class="inp" id="o_status">'+DEAL_STAGES.map(s=>'<option value="'+s.k+'"'+(s.k===(e.status||'new')?' selected':'')+'>'+s.t+'</option>').join('')+'</select></div>'+
      '<div class="fld"><div class="k">Источник</div><select class="inp" id="o_source">'+['CRM'].concat(SRC_OPTS).map(o=>'<option'+(o===srcVal?' selected':'')+'>'+o+'</option>').join('')+'</select></div>'+
      '<div class="fld"><div class="k">Срок (до)</div><input class="inp" id="o_deadline" value="'+esc(e.deadline||'')+'" placeholder="25.11"></div></div>'+
      '<div class="fld"><div class="k">Позиции заказа</div><div class="items" id="o_items"></div>'+
      '<button class="btn-sec" id="o_add">+ позиция</button></div>'+
      '<div class="grid2">'+
      '<div class="fld"><div class="k">Предоплата, ₽</div><input class="inp" id="o_prepaid" type="number" min="0" value="'+(Number(e.prepaid)||0)+'"></div>'+
      '<div class="fld"><div class="k">&nbsp;</div><div class="totals" id="o_totals"></div></div></div>'+
      '<div class="fld"><div class="k">Заметка / договорённости</div><textarea class="inp" id="o_note">'+esc(e.note||'')+'</textarea></div>'+
      (id?'<div class="fld"><button class="btn-sec" id="o_del" style="border-color:#f2b8b8;color:#ff5752">Удалить сделку</button></div>':''));
    if(e.leadId) $('#mInfo').textContent='🔗 из лида';

    const wrap=$('#o_items');
    const itHTML=(it)=>'<div class="it">'+
      '<div class="r1"><select class="inp o-cat">'+catOpts+'</select></div>'+
      '<div class="r2">'+
        '<div><div class="sm">наименование</div><input class="inp o-name" value="'+esc(it.name||'')+'" placeholder="услуга"></div>'+
        '<div><div class="sm">кол-во</div><input class="inp o-qty" type="number" min="0" step="0.1" value="'+(it.qty||1)+'"></div>'+
        '<div><div class="sm">цена</div><input class="inp o-price" type="number" min="0" value="'+(Number(it.price)||0)+'"></div>'+
        '<div><div class="sm">сумма</div><div class="it-sum o-sum">0 ₽</div></div>'+
        '<div><div class="sm">&nbsp;</div><button class="ic-btn del o-rm">🗑</button></div>'+
      '</div>'+
      '<div style="margin-top:7px"><div class="sm">характеристики (тираж, размер, материал, макет…)</div><input class="inp o-spec" value="'+esc(it.spec||'')+'" placeholder="напр. 1000 шт, 90×50, 4+4, матовая ламинация, макет заказчика"></div>'+
    '</div>';
    function recalc(){ let t=0; wrap.querySelectorAll('.it').forEach(it=>{const q=Number(it.querySelector('.o-qty').value)||0,p=Number(it.querySelector('.o-price').value)||0;it.querySelector('.o-sum').textContent=money(q*p);t+=q*p;});
      const pre=Number($('#o_prepaid').value)||0, rem=t-pre;
      $('#o_totals').innerHTML='Итого: <span class="big">'+money(t)+'</span>'+(pre>0?'<br>Предоплата: '+money(pre)+'<br><span class="rem">Остаток: '+money(rem)+'</span>':''); return t; }
    function wireIt(it){
      it.querySelector('.o-cat').onchange=ev=>{const c=DATA.catalog.find(x=>x.id===ev.target.value);if(c){it.querySelector('.o-name').value=c.name;it.querySelector('.o-price').value=c.price;recalc();}};
      it.querySelectorAll('.o-qty,.o-price').forEach(i=>i.oninput=recalc);
      it.querySelector('.o-rm').onclick=()=>{it.remove();recalc();};
    }
    items.forEach(it=>{wrap.insertAdjacentHTML('beforeend',itHTML(it));wireIt(wrap.lastElementChild);});
    $('#o_prepaid').oninput=recalc; recalc();
    $('#o_add').onclick=()=>{wrap.insertAdjacentHTML('beforeend',itHTML({name:'',spec:'',qty:1,price:0}));wireIt(wrap.lastElementChild);recalc();};
    if(id)$('#o_del').onclick=async()=>{ if(!confirm('Удалить сделку?'))return; await remove('deals',id); DATA.deals=DATA.deals.filter(x=>x.id!==id);
      const lk=DATA.leads.find(x=>x.dealId===id); if(lk){lk.dealId='';try{await save('leads',lk);}catch(e){}} hideModal(); render(); };

    $('#mSave').onclick=async()=>{
      const rows=[...wrap.querySelectorAll('.it')].map(it=>({name:it.querySelector('.o-name').value.trim(),spec:it.querySelector('.o-spec').value.trim(),qty:Number(it.querySelector('.o-qty').value)||0,unit:'',price:Number(it.querySelector('.o-price').value)||0})).filter(r=>r.name);
      const total=rows.reduce((a,r)=>a+r.qty*r.price,0);
      const rec=Object.assign({},e,{id:e.id||genId(),client:$('#o_client').value.trim(),phone:$('#o_phone').value.trim(),status:$('#o_status').value,source:$('#o_source').value,deadline:$('#o_deadline').value.trim(),items:rows,total,prepaid:Number($('#o_prepaid').value)||0,note:$('#o_note').value.trim(),leadId:e.leadId||'',ts:e.ts||new Date().toISOString()});
      if(!rec.client&&!rows.length){toast('Заполните клиента или позиции');return;}
      try{
        const it=await save('deals',rec); const i=DATA.deals.findIndex(x=>x.id===rec.id);
        if(i>=0)DATA.deals[i]=it;else DATA.deals.unshift(it);
        // связать лид: пометить «в сделке»
        if(rec.leadId){ const lead=DATA.leads.find(x=>x.id===rec.leadId); if(lead){lead.dealId=it.id; lead.stage='won'; try{await save('leads',lead);}catch(e){}} }
        toast('Сделка сохранена'); hideModal(); render();
      }catch(err){}
    };
  }

  /* ---------- common ---------- */
  function bindCommon(){ const r=$('#refresh'); if(r)r.onclick=()=>loadAll(); $('#main').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{VIEW=b.dataset.go;render();}); }
  document.querySelectorAll('.side .nav').forEach(n=>n.onclick=()=>{VIEW=n.dataset.view;render();});
  $('#q').addEventListener('input',e=>{Q=e.target.value;render();});

  /* ---------- auth ---------- */
  async function enter(){ const p=$('#pass').value.trim(); if(!p)return;
    try{ PASS=p; await loadAll(); try{localStorage.setItem('riks_leads_pass',p);}catch(e){} $('#gate').style.display='none'; $('#app').style.display='block'; }
    catch(e){ $('#err').textContent='Неверный пароль или хранилище недоступно.'; } }
  $('#enter').onclick=enter; $('#pass').addEventListener('keydown',e=>{if(e.key==='Enter')enter();});
  $('#exit').onclick=()=>{try{localStorage.removeItem('riks_leads_pass');}catch(e){}location.reload();};
