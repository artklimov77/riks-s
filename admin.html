<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рикс+С — CRM</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="img/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#E3241B; --red-d:#B5161A; --or:#F7941D; --or-d:#D97706;
    --bg:#f5f2ef; --panel:#fff; --line:#ebe5e0; --line2:#dcd3cc;
    --ink:#2B2A28; --muted:#77706a; --muted2:#a59d96;
    --ok:#2e9e4f; --warn:#e6a100; --bad:#E3241B;
    --shadow:0 1px 3px rgba(43,42,40,.09);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Open Sans',system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;color:inherit}

  .gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--red),var(--or));z-index:100;padding:16px}
  .gate .box{background:#fff;border-radius:14px;padding:30px 28px;width:360px;max-width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .gate img{width:84px;height:84px;object-fit:contain}
  .gate .logo{font-weight:800;font-size:22px;margin-top:6px}.gate .logo b{color:var(--red)}
  .gate p{color:var(--muted);font-size:13px;margin:6px 0 16px}
  .gate input,.gate select{width:100%;height:46px;border:1.5px solid var(--line2);border-radius:8px;padding:0 14px;font-size:15px;outline:none;margin-bottom:10px;background:#fff}
  .gate input:focus,.gate select:focus{border-color:var(--red)}
  .gate button{width:100%;height:46px;border-radius:8px;background:var(--red);color:#fff;font-weight:700;font-size:15px}
  .gate .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}

  .app{display:none;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:40;height:56px;background:linear-gradient(90deg,var(--red),#ec4a1c 60%,var(--or));display:flex;align-items:center;gap:14px;padding:0 16px;color:#fff}
  .topbar .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;white-space:nowrap}
  .topbar .brand img{width:36px;height:36px;background:#fff;border-radius:50%;object-fit:contain;padding:2px}
  .topbar .search{flex:1;max-width:460px}
  .topbar .search input{width:100%;height:36px;border:none;border-radius:8px;padding:0 14px;font-size:14px;outline:none;background:rgba(255,255,255,.96)}
  .topbar .sp{flex:1}
  .tb-btn{color:#fff;font-size:13px;font-weight:700;padding:7px 12px;border-radius:7px;background:rgba(255,255,255,.18);white-space:nowrap;position:relative}
  .tb-btn:hover{background:rgba(255,255,255,.3)}
  .tb-btn .bd{position:absolute;top:-5px;right:-5px;background:#fff;color:var(--red);font-size:11px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .me{font-size:13px;font-weight:700;background:rgba(0,0,0,.15);padding:7px 12px;border-radius:7px;white-space:nowrap}

  .body{display:flex;align-items:flex-start}
  .side{width:220px;flex:0 0 220px;background:var(--panel);border-right:1px solid var(--line);min-height:calc(100vh - 56px);position:sticky;top:56px}
  .side .grp{padding:10px 0;border-bottom:1px solid var(--line)}
  .side .gt{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted2);padding:6px 18px 4px;font-weight:700}
  .side .nav{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:14px;color:#4a4540;border-left:3px solid transparent;cursor:pointer}
  .side .nav .ic{width:18px;text-align:center;font-size:15px}
  .side .nav:hover{background:#faf6f3}
  .side .nav.on{background:#fdeeea;border-left-color:var(--red);color:var(--red-d);font-weight:700}
  .side .nav .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}

  .main{flex:1;min-width:0;padding:18px 20px 60px}
  .page-h{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .page-h h1{font-size:22px;font-weight:800}
  .tabs{display:flex;gap:4px;background:#ebe4de;border-radius:9px;padding:3px;flex-wrap:wrap}
  .tabs button{padding:7px 14px;border-radius:7px;font-size:13px;font-weight:700;color:var(--muted)}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  .btn-pri{background:var(--red);color:#fff;font-weight:700;font-size:13px;border-radius:8px;padding:9px 16px}
  .btn-pri:hover{background:var(--red-d)}
  .btn-or{background:var(--or);color:#fff;font-weight:700;font-size:13px;border-radius:8px;padding:9px 16px}
  .btn-sec{border:1.5px solid var(--line2);color:var(--ink);font-weight:700;font-size:13px;border-radius:8px;padding:8px 14px;background:#fff}
  .btn-sec:hover{border-color:var(--red);color:var(--red-d)}
  .btn-sm{padding:5px 10px;font-size:12px}
  .spacer{margin-left:auto}

  .note{background:#fff6e5;border:1px solid #ffe0a3;color:#7a5a00;border-radius:9px;padding:12px 16px;font-size:13px;margin-bottom:14px;line-height:1.55}
  .note.red{background:#fdecea;border-color:#f6c3bd;color:#8a1b13}

  .kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
  .col{flex:0 0 250px;width:250px;background:#ece5df;border-radius:11px;display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
  .col.drag-over{outline:2px dashed var(--red);outline-offset:-2px}
  .col .ch{padding:10px 12px 8px;border-radius:11px 11px 0 0;color:#fff}
  .col .ch .cn{font-weight:800;font-size:13px}
  .col .ch .cm{font-size:11px;opacity:.95;margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
  .col .ch .ow{background:rgba(255,255,255,.25);border-radius:4px;padding:0 5px}
  .col .cards{padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:40px}
  .card{background:#fff;border-radius:9px;padding:10px 11px;box-shadow:var(--shadow);cursor:pointer;border-left:3px solid var(--line2)}
  .card:hover{box-shadow:0 2px 8px rgba(0,0,0,.14)}
  .card.dragging{opacity:.4}
  .card .nm{font-weight:700;font-size:13px}
  .card .ph{font-size:13px;color:var(--red-d);font-weight:600;margin-top:2px}
  .card .sv{font-size:12px;color:var(--muted);margin-top:4px}
  .card .sum{font-weight:800;font-size:14px;margin-top:6px}
  .card .rem{font-size:11px;color:var(--bad);margin-top:1px}
  .card .miss{font-size:11px;color:#9a5b00;background:#fff3d6;border-radius:4px;padding:2px 6px;margin-top:6px;display:inline-block}
  .card .meta{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
  .badge{font-size:10px;font-weight:700;padding:3px 7px;border-radius:4px;color:#fff;white-space:nowrap}
  .tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:#f3eee9;color:var(--muted)}
  .card .tm{font-size:10px;color:var(--muted2);margin-left:auto}

  .table{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:auto}
  .table table{width:100%;border-collapse:collapse;min-width:640px}
  .table th{background:#faf6f3;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}
  .table td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  .table tr:last-child td{border-bottom:none}
  .table tr.click:hover td{background:#fdf7f4;cursor:pointer}
  .table .nm{font-weight:700}
  .table .ph{color:var(--red-d);font-weight:600}
  .st-pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:12px;color:#fff;display:inline-block;white-space:nowrap}
  .cat-h{font-weight:800;font-size:15px;margin:20px 0 8px;color:var(--red-d)}
  .inp{height:36px;border:1.5px solid var(--line2);border-radius:7px;padding:0 10px;font-size:13px;outline:none;width:100%;background:#fff}
  .inp:focus{border-color:var(--or)}
  .inp.miss,.chk.miss{border-color:var(--bad)!important;background:#fff4f2}
  td .inp{height:32px}
  .ic-btn{width:32px;height:32px;border-radius:7px;font-size:15px;color:var(--muted)}
  .ic-btn:hover{background:#f3eee9}
  .ic-btn.del:hover{background:#ffe9e7;color:var(--bad)}

  .cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px 17px}
  .kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
  .kpi span{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
  .kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--or)}.kpi.on{border-color:var(--red)!important;box-shadow:0 0 0 3px #fdeeea}
  .chart{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:16px}
  .chart h3{font-size:15px;font-weight:800;margin-bottom:12px}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .bar-row .bl{width:150px;font-size:12px;color:var(--muted);text-align:right;flex:0 0 150px}
  .bar-row .bt{flex:1;background:#f3eee9;border-radius:5px;height:22px;overflow:hidden}
  .bar-row .bf{height:100%;border-radius:5px;display:flex;align-items:center;padding:0 8px;color:#fff;font-size:11px;font-weight:700;min-width:30px;white-space:nowrap}
  .funnel{display:flex;gap:6px;flex-wrap:wrap}
  .funnel .fstep{flex:1;min-width:90px;text-align:center;padding:10px 6px;border-radius:8px;color:#fff}
  .funnel .fstep b{display:block;font-size:19px;font-weight:800}
  .funnel .fstep span{font-size:11px;font-weight:700;display:block}
  .funnel .fstep .fm{font-size:11px;font-weight:700;margin-top:3px;background:rgba(255,255,255,.22);border-radius:4px}
  .empty{text-align:center;color:var(--muted);padding:44px 0}

  .scrim{position:fixed;inset:0;background:rgba(30,20,15,.42);z-index:60;display:none}
  .scrim.on{display:block}
  .drawer{position:fixed;top:0;right:0;height:100%;width:440px;max-width:94vw;background:#fff;z-index:70;transform:translateX(100%);transition:transform .22s ease;box-shadow:-8px 0 30px rgba(0,0,0,.2);display:flex;flex-direction:column}
  .drawer.on{transform:translateX(0)}
  .drawer .dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
  .drawer .dh .nm{font-size:19px;font-weight:800}
  .x{margin-left:auto;font-size:24px;color:var(--muted);line-height:1}
  .drawer .dc{padding:18px 20px;overflow-y:auto;flex:1}
  .fld{margin-bottom:12px}
  .fld .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted2);font-weight:700;margin-bottom:4px}
  .fld .k .rq{color:var(--bad)}
  .fld .v{font-size:14px;white-space:pre-wrap}.fld .v a{color:var(--red-d);font-weight:700}
  .stages{display:flex;flex-wrap:wrap;gap:6px}
  .stages button{font-size:12px;font-weight:700;padding:7px 11px;border-radius:7px;border:1.5px solid var(--line2);color:var(--muted);background:#fff}
  textarea.inp{height:auto;min-height:64px;padding:9px 11px;resize:vertical}
  .drawer .df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px}
  .drawer .df .call{flex:1;height:44px;border-radius:8px;background:var(--ok);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
  .drawer .df .save{flex:1;height:44px;border-radius:8px;background:var(--red);color:#fff;font-weight:700}
  .linkbox{background:#fff4ec;border:1px solid #fbd5b5;border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:12px}
  .linkbox a{color:var(--red-d);font-weight:700;cursor:pointer}

  .modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:760px;max-width:96vw;max-height:94vh;background:#fff;border-radius:14px;z-index:80;display:none;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.3)}
  .modal.on{display:flex}
  .modal.sm{width:480px}
  .modal .mh{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .modal .mh h2{font-size:18px;font-weight:800}
  .modal .mb{padding:16px 20px;overflow-y:auto}
  .modal .mf{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
  .sec{border:1px solid var(--line);border-radius:11px;padding:12px 14px 4px;margin-bottom:12px}
  .sec>h4{font-size:13px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .sec>h4 .hint{font-weight:400;color:var(--muted);font-size:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .items .it{border:1px solid var(--line);border-radius:9px;padding:9px;margin-bottom:8px;background:#fcfaf8}
  .items .it .r2{display:grid;grid-template-columns:1fr 70px 96px 92px 34px;gap:8px;align-items:end;margin-top:7px}
  .sm-l{font-size:10px;color:var(--muted2);font-weight:700;text-transform:uppercase}
  .it-sum{text-align:right;font-weight:800;white-space:nowrap;font-size:13px;height:32px;display:flex;align-items:center;justify-content:flex-end}
  .totals{text-align:right;font-size:13px;line-height:1.7}
  .totals .big{font-size:19px;font-weight:800}
  .totals .rem{color:var(--bad);font-weight:700}
  .checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-bottom:10px}
  .chk{display:flex;align-items:flex-start;gap:8px;font-size:13px;border:1.5px solid transparent;border-radius:6px;padding:3px 4px;cursor:pointer}
  .chk input{margin-top:2px;accent-color:var(--red);width:16px;height:16px;flex:0 0 16px}
  .gate-list{margin:8px 0 0 18px;line-height:1.8}
  .log{font-size:12px;color:var(--muted);line-height:1.6;max-height:140px;overflow:auto}
  .pillsel{display:flex;gap:6px;flex-wrap:wrap}
  .pillsel button{border:1.5px solid var(--line2);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;background:#fff}
  .pillsel button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pillsel.miss button{border-color:var(--bad)}

  .notifs{position:fixed;right:16px;bottom:16px;z-index:90;display:flex;flex-direction:column;gap:10px;width:340px;max-width:calc(100vw - 32px)}
  .ntf{background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.22);border-left:5px solid var(--red);padding:12px 14px;animation:pop .25s ease}
  .ntf.mine{border-left-color:var(--or);box-shadow:0 10px 30px rgba(247,148,29,.45)}
  .ntf .nt{font-weight:800;font-size:13px}
  .ntf .nx{font-size:13px;color:var(--muted);margin-top:3px}
  .ntf .na{display:flex;gap:8px;margin-top:9px}
  @keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:9px;font-size:13px;z-index:95;opacity:0;transition:.2s;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .st-row{display:grid;grid-template-columns:24px 1fr 90px 150px 34px;gap:8px;align-items:center;margin-bottom:6px}
  .st-row input[type=color]{width:24px;height:24px;border:none;padding:0;background:none}
  .req-box{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);margin:-2px 0 10px}
  .req-box label{display:flex;align-items:center;gap:4px;cursor:pointer}
  .req-box input{accent-color:var(--red)}
  .hint{color:var(--muted);font-weight:400;font-size:12px}
  .lnk{color:var(--red-d);font-weight:700;cursor:pointer}
  .sec>h4 .lnk{margin-left:auto;font-size:12px}
  .sec>h4 .spacer{margin-left:auto}
  .modal.xl{width:1180px;height:94vh}
  .modal.xl .mb{flex:1;padding:0;display:flex;flex-direction:column;min-height:0}
  .modal.xl .sec{background:#fff}
  .dl-head{padding:12px 20px 0;border-bottom:1px solid var(--line);background:#fff}
  .dl-sum{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:14px;background:#f6f1ed;border:1px solid var(--line)}
  .chip.gchip.bad{background:#fdecea;color:#8a1b13;border-color:#f6c3bd}
  .chip.gchip.ok{background:#eef7f0;color:#1d6b35;border-color:#cfe9d7}
  .dl-tabs{display:flex;gap:2px;overflow-x:auto}
  .dl-tabs button{padding:10px 16px;font-size:14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
  .dl-tabs button:hover{color:var(--ink)}
  .dl-tabs button.on{color:var(--red-d);border-bottom-color:var(--red)}
  .dl-tabs .n:not(:empty){background:#f1e9e3;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:6px;color:var(--muted)}
  .dl-tabs .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-left:6px;vertical-align:middle}
  .dl-tabs .dot[hidden]{display:none}
  .dl-body{flex:1;overflow-y:auto;padding:16px 20px;background:var(--bg)}
  .dl-pane{display:none}.dl-pane.on{display:block}
  .dl-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,1fr);gap:14px;align-items:start}
  .dl-side{position:sticky;top:0}
  .modal.xl .inp{height:38px;font-size:14px}
  .modal.xl textarea.inp{min-height:80px;font-size:14px;line-height:1.5}
  .qa-box{background:#fffaf5;border:1px solid #fbe0cc;border-radius:11px;padding:12px;margin-bottom:12px}
  .qa-h{font-size:13px;font-weight:800;color:var(--red-d);margin-bottom:10px}.qa-h span{font-weight:600;color:var(--muted);font-size:12px;margin-left:4px}
  .qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
  .qa .qi{background:#fff;border:1px solid #f3e2d5;border-radius:9px;padding:9px 12px}
  .qa .qq{font-size:12px;color:var(--muted);line-height:1.35}
  .qa .qv{font-size:15px;font-weight:700;margin-top:3px;line-height:1.3}
  .qa-flags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .flag{font-size:12px;font-weight:700;padding:5px 10px;border-radius:7px;background:#eef7f0;color:#1d6b35}
  .flag.warn{background:#fdecea;color:#8a1b13}
  .drop{border:2px dashed var(--line2);border-radius:12px;padding:20px;text-align:center;color:var(--muted);background:#fff;cursor:pointer;transition:.15s;font-size:14px}
  .drop:hover,.drop.over{border-color:var(--or);background:#fff6ec;color:var(--ink)}
  .drop b{color:var(--red-d)}.drop.sm{padding:12px;font-size:13px}
  .files{display:flex;flex-direction:column;gap:6px}
  .file{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  .file.click{cursor:pointer}.file.click:hover{border-color:var(--or)}
  .file .fi{width:36px;height:36px;border-radius:8px;background:#f6efe9;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 36px}
  .file .fn{font-weight:700;font-size:13px;word-break:break-word}
  .file .fm{font-size:11px;color:var(--muted);margin-top:1px}
  .file .fa{margin-left:auto;display:flex;gap:4px;align-items:center}
  .file .fa .inp{height:30px;font-size:12px;width:auto;max-width:170px}

<script>
(() => {
  const $ = s => document.querySelector(s);
  const $$ = (s,r) => [...(r||document).querySelectorAll(s)];
  const esc = s => String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  const genId = () => (Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8));
  const money = n => (Math.round(Number(n)||0)).toLocaleString('ru-RU')+' ₽';
  const fmt = ts => { try { return new Date(ts).toLocaleString('ru-RU',{timeZone:'Europe/Moscow',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); } catch(e){ return ts||''; } };
  const fdate = ts => { try { return new Date(ts).toLocaleDateString('ru-RU'); } catch(e){ return ''; } };
  const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200); };
  const ls = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };

  /* ================= КОНСТАНТЫ ================= */
  const KINDS=['Наружная реклама','Интерьер / оформление','Реклама на транспорте','Мобильные стойки','Различные наклейки','Полиграфия','Широкоформатная печать','Стенды','Неоновые вывески','Добрая сувенирка','Дизайн / логотип'];
  const LEAD_STAGES=[
    {k:'new',t:'Новая',col:'#F7941D'},{k:'work',t:'В работе',col:'#e46a1d'},
    {k:'junk',t:'Мусор / не определились',col:'#a59d96'},
    {k:'won',t:'В сделке',col:'#2e9e4f'},{k:'lost',t:'Отказ',col:'#7a2620'}];
  const SRC=[
    {re:/avito|авито/i,t:'Авито',c:'#0a8f3c'},{re:/vk|вконтакт/i,t:'ВКонтакте',c:'#2787f5'},
    {re:/t\.me|telegram|телеграм|tg/i,t:'Telegram',c:'#29a9eb'},{re:/max|макс/i,t:'MAX',c:'#6b4de6'},
    {re:/yandex|яндекс|карт|maps/i,t:'Яндекс',c:'#ff3d00'},
    {re:/2gis|2гис/i,t:'2ГИС',c:'#39c936'},{re:/uds|юдс/i,t:'UDS',c:'#3b3fd8'},{re:/лифлет|листовк|qr/i,t:'Листовка / QR',c:'#b0388b'},
    {re:/реферал|ref|рекоменд|сарафан/i,t:'Рекомендация',c:'#8e44ad'},{re:/повтор/i,t:'Повторный',c:'#5d6d7e'},
    {re:/звон|тел|phone/i,t:'Звонок',c:'#e67e22'},{re:/офис|визит|пришёл|пришел|адрес/i,t:'Офис / визит',c:'#16a085'},
    {re:/сайт|site|riks|quiz|квиз/i,t:'Сайт',c:'#E3241B'}];
  const srcOf=s=>{s=(s||'');for(const x of SRC)if(x.re.test(s))return x;return {t:s?String(s).slice(0,18):'—',c:'#8a817a'};};
  const SRC_OPTS=['Звонок','Офис / визит','Сайт','Авито','ВКонтакте','Telegram','MAX','Яндекс Карты','2ГИС','UDS','Листовка / QR','Рекомендация','Повторный','Мероприятие'];

  // Поля сделки, которые можно сделать обязательными («шлагбаумы»)
  const FIELDS={
    source:{t:'Источник (откуда пришёл)',ok:d=>!!d.source},
    kind:{t:'Направление работ',ok:d=>!!d.kind},
    payType:{t:'Оплата: нал / безнал',ok:d=>!!d.payType},
    docFlow:{t:'Документы: СБИС / живьём',ok:d=>!!d.docFlow},
    sizes:{t:'Размеры',ok:d=>!!(d.sizes||'').trim()},
    materials:{t:'Материалы',ok:d=>!!(d.materials||'').trim()},
    tz:{t:'ТЗ / ответы клиента',ok:d=>!!(d.tz||'').trim()||(d.quiz||[]).length>0},
    mockupPath:{t:'Макет (файл в «Файлах» или путь)',ok:d=>!!(d.mockupPath||'').trim()||(d.files||[]).some(f=>f&&f.cat==='mockup')},
    items:{t:'Позиции заказа',ok:d=>(d.items||[]).length>0},
    total:{t:'Сумма заказа',ok:d=>dealTotal(d)>0},
    deadline:{t:'Срок сдачи',ok:d=>!!(d.deadline||'').trim()},
    prepaid:{t:'Предоплата внесена',ok:d=>Number(d.prepaid)>0},
    contract:{t:'Договор подписан',ok:d=>!!(d.docs||{}).contract},
    preApproval:{t:'Вывеска: предсогласование УАиГ / Минкультуры',when:d=>d.kind==='Наружная реклама',ok:d=>!!(d.docs||{}).preApproval},
    legal:{t:'Транспорт: юр. заключение (закон о рекламе)',when:d=>d.kind==='Реклама на транспорте',ok:d=>!!(d.docs||{}).legal},
    updDate:{t:'Дата подписания УПД',ok:d=>!!d.updDate},
    paidFull:{t:'Оплачено полностью',ok:d=>!!d.paidFull}

  const OLD_STATUS={kp:'calc',ready:'mount',paid:'done'};

  let PASS='', VIEW='leads', Q='', ME=ls.get('riks_me',''), DEMO=false;

  /* ================= API ================= */
  const COL={leads:'leads',deals:'orders',catalog:'catalog',clients:'clients',tasks:'tasks',settings:'settings'};
  async function api(op,col,extra){
    if(DEMO) return {ok:true,demo:true,items:[]};
    const r=await fetch('/api/db',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({pass:PASS,op,col:COL[col]||col},extra||{}))});
    if(r.status===401) throw new Error('auth');
    return r.json();
  }
  const SNAP={leads:null,deals:null,tasks:null}; const MINE=new Set();
  async function loadAll(silent){
    if(DEMO){ render(); return; }
    const [l,o,c,cl,st,tk]=await Promise.all([api('list','leads'),api('list','deals'),api('list','catalog'),api('list','clients'),api('list','settings'),api('list','tasks')]);
    DATA.leads=l.items||[]; DATA.deals=(o.items||[]).map(normDeal); DATA.catalog=c.items||[]; DATA.clients=cl.items||[]; DATA.tasks=tk.items||[];
    DATA.settings=normSettings((st.items||[]).find(x=>x.id==='main'));
    DATA._nostore=(l.note==='storage-not-configured');
    if(!DATA._nostore && (!DATA.catalog.length || !DATA.catalog.some(x=>x.src==='uds'))){ const s=await api('importUds','catalog'); if(s.items)DATA.catalog=s.items; }
    detectChanges();
    if(!silent) render(); else softRender();

  function normSettings(s){
    const d=JSON.parse(JSON.stringify(DEFAULT_SETTINGS)); if(!s) return d;
    return Object.assign(d,s,{company:Object.assign(d.company,s.company||{}),funnels:Object.assign(d.funnels,s.funnels||{})});
  }
  function normDeal(d){ if(OLD_STATUS[d.status]&&(d.funnel||'sales')==='sales') d.status=OLD_STATUS[d.status]; d.funnel=d.funnel||'sales'; d.docs=d.docs||{}; d.log=d.log||[]; d.files=normFiles(d.files); return d; }
  async function save(col,rec){
    if(DEMO){ toast('Демо: сохранение отключено'); return rec; }
    const r=await api('save',col,{data:rec});
    if(r.ok){ MINE.add(col+':'+r.item.id+':'+r.item.upd); return r.item; }
    toast(r.note==='storage-not-configured'?'Хранилище не подключено':'Не сохранилось'); throw new Error('save');
  }
  async function remove(col,id){ if(DEMO){toast('Демо');return;} const r=await api('delete',col,{id}); if(!r.ok)toast('Не удалилось'); }

  const filt = arr => { const q=Q.trim().toLowerCase(); if(!q)return arr; return arr.filter(x=>JSON.stringify(x).toLowerCase().includes(q)); };
  const dealOf = id => DATA.deals.find(d=>d.id===id);
  const dealTotal = d => (d.items||[]).reduce((a,i)=>a+(Number(i.qty)||0)*(Number(i.price)||0),0);
  const dealRem = d => dealTotal(d)-(Number(d.prepaid)||0)-(Number(d.paidMore)||0);

  // «Шлагбаум»: что не заполнено, чтобы находиться на стадии k (накопительно по всем стадиям до неё)
  function missingFor(d,k){
    const st=stagesOf(d.funnel||'sales'); const idx=st.findIndex(s=>s.k===k); if(idx<0) return [];
    if(st[idx].lost) return [];
    const req=new Set(); st.slice(0,idx+1).forEach(s=>{ if(!s.lost)(s.req||[]).forEach(f=>req.add(f)); });
    return [...req].filter(f=>FIELDS[f]&&(!FIELDS[f].when||FIELDS[f].when(d))&&!FIELDS[f].ok(d));
  }

  /* ================= УВЕДОМЛЕНИЯ ================= */
  let NOTIFS=ls.get('riks_notifs',[]);
  function pushNotif(n){ if(NOTIFS.some(x=>x.id===n.id))return; NOTIFS.unshift(n); NOTIFS=NOTIFS.slice(0,30); ls.set('riks_notifs',NOTIFS); drawNotifs();
    try{ if(window.Notification&&Notification.permission==='granted'&&document.hidden) new Notification(n.title,{body:n.text,icon:'img/logo-mark.png'}); }catch(e){} }
  function drawNotifs(){
    const box=$('#notifs'); const show=NOTIFS.slice(0,4);
    box.innerHTML=show.map(n=>'<div class="ntf'+(n.owner&&n.owner===ME?' mine':'')+'" data-id="'+esc(n.id)+'"><div class="nt">'+esc(n.title)+'</div><div class="nx">'+esc(n.text)+'</div>'+
      '<div class="na">'+(n.ref?'<button class="btn-pri btn-sm" data-a="open">Открыть</button>':'')+'<button class="btn-sec btn-sm" data-a="ok">✓ Понял(а)</button>'+(NOTIFS.length>4?'<span style="margin-left:auto;font-size:11px;color:var(--muted)">ещё '+(NOTIFS.length-4)+'</span>':'')+'</div></div>').join('');
    const c=$('#bellCnt'); if(NOTIFS.length){c.style.display='flex';c.textContent=NOTIFS.length;}else c.style.display='none';
    $$('.ntf',box).forEach(el=>{ const n=NOTIFS.find(x=>x.id===el.dataset.id);
      el.querySelector('[data-a=ok]').onclick=()=>dismiss(n.id);
      const o=el.querySelector('[data-a=open]'); if(o)o.onclick=()=>{ dismiss(n.id); openRef(n.ref); }; });
  }
  function dismiss(id){ NOTIFS=NOTIFS.filter(x=>x.id!==id); ls.set('riks_notifs',NOTIFS); drawNotifs(); }
  function openRef(ref){
    // не теряем несохранённое: если открыта карточка — спрашиваем
    if($('#modal').classList.contains('on')&&$('#modal').dataset.dirty==='1'&&!confirm('В открытой карточке есть несохранённые изменения. Открыть уведомление и потерять их?')) return;
    hideModal(); closeDrawer();
    if(ref.t==='task'){ VIEW='tasks'; render(); editTask(ref.id,null,tasksView); } else if(ref.t==='lead'){ VIEW='leads'; render(); openLead(ref.id); } else { const d=dealOf(ref.id); VIEW=(d&&d.funnel==='supply')?'supply':'deals'; render(); editDeal(ref.id); }
  }
  function detectChanges(){
    const pl=SNAP.leads, pd=SNAP.deals;
    if(pl){ DATA.leads.forEach(l=>{ if(!pl[l.id]&&!MINE.has('leads:'+l.id+':'+l.upd)) pushNotif({id:'L'+l.id,title:'🔥 Новая заявка'+(l.service?': '+l.service:''),text:(l.name||'Без имени')+' · '+(l.phone||'')+' · '+srcOf(l.source).t,owner:stOf(stagesOf('sales'),'new').owner,ref:{t:'lead',id:l.id}}); }); }
    if(pd){ DATA.deals.forEach(d=>{ const p=pd[d.id]; if(MINE.has('deals:'+d.id+':'+d.upd)) return;
      const st=stOf(stagesOf(d.funnel),d.status);
      if(!p) pushNotif({id:'D'+d.id+d.upd,title:'💼 Новая сделка → «'+st.t+'»',text:(d.client||'')+(st.owner?' · отвечает '+st.owner:''),owner:st.owner,ref:{t:'deal',id:d.id}});
      else if(p.status!==d.status) pushNotif({id:'D'+d.id+d.upd,title:'➡️ Сделка в «'+st.t+'»',text:(d.client||'')+(st.owner?' · отвечает '+st.owner:''),owner:st.owner,ref:{t:'deal',id:d.id}});
      else if(p.upd!==d.upd) pushNotif({id:'E'+d.id+d.upd,title:'✎ Изменена сделка',text:(d.client||'')+' · «'+st.t+'»'+(d.log&&d.log[0]?' · '+d.log[0].who:''),owner:st.owner,ref:{t:'deal',id:d.id}});
    }); }
    const pt=SNAP.tasks; if(pt){ DATA.tasks.forEach(t=>{ if(!pt[t.id]&&!MINE.has('tasks:'+t.id+':'+t.upd)&&!t.done) pushNotif({id:'T'+t.id,title:'🗓 Новая задача'+(t.who?' для '+t.who:''),text:(t.title||'')+(t.due?' · '+dHuman(t.due):'')+(t.time?' '+t.time:'')+(t.by?' · от '+t.by:''),owner:t.who,ref:{t:'task',id:t.id}}); }); }
    SNAP.tasks={}; DATA.tasks.forEach(t=>SNAP.tasks[t.id]=1);
    SNAP.leads={}; DATA.leads.forEach(l=>SNAP.leads[l.id]=1);
    SNAP.deals={}; DATA.deals.forEach(d=>SNAP.deals[d.id]={status:d.status,upd:d.upd});
  }
  // Telegram ответственному (если у сотрудника указан chat id и в Vercel есть TELEGRAM_BOT_TOKEN)
  function tgOwner(d){ const st=stOf(stagesOf(d.funnel),d.status); const m=teamOf(st.owner); if(!m||!m.tg||DEMO) return;
    api('notify',null,{chatId:m.tg,text:'Рикс+С CRM: сделка «'+(d.client||'')+'» → '+st.t+(ME?' (перевёл(а) '+ME+')':'')+'\n'+location.origin+'/admin.html'}).catch(()=>{}); }
  // фоновое обновление не должно сбивать работу: не перерисовываем, если открыта карточка, идёт ввод или открыт редактор
  function softRender(){
    const busy=$('#modal').classList.contains('on')||$('#modal2').classList.contains('on')||$('#drawer').classList.contains('on')||/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')||['catalog','settings','clients'].includes(VIEW);
    if(busy) updateCounters(); else { const k=$('.kanban'); const sx=k?k.scrollLeft:0, sy=window.scrollY; render(); const k2=$('.kanban'); if(k2)k2.scrollLeft=sx; window.scrollTo(0,sy); }

  $('#bell').onclick=()=>{
    if(window.Notification&&Notification.permission==='default') Notification.requestPermission();
    showModal('Уведомления',NOTIFS.length?NOTIFS.map(n=>'<div class="ntf'+(n.owner===ME?' mine':'')+'" style="margin-bottom:8px"><div class="nt">'+esc(n.title)+'</div><div class="nx">'+esc(n.text)+'</div></div>').join(''):'<div class="empty">Нет новых уведомлений</div>',{sm:true,saveText:'Прочитать все'});
    $('#mSave').onclick=()=>{NOTIFS=[];ls.set('riks_notifs',NOTIFS);drawNotifs();hideModal();};

  /* ================= RENDER ================= */
  function updateCounters(){ const nu=DATA.leads.filter(l=>(l.stage||'new')==='new').length; const nc=$('#navCnt'); if(nu){nc.style.display='flex';nc.textContent=nu;}else nc.style.display='none';
    const tc=$('#taskCnt'); const nt=myDue().length; if(tc){ if(nt){tc.style.display='flex';tc.textContent=nt;tc.title='Мои задачи на сегодня и просроченные';}else tc.style.display='none'; } $('#meBtn').textContent='👤 '+(ME||'Кто вы?'); }
  function render(){
    $$('.side .nav').forEach(n=>n.classList.toggle('on',n.dataset.view===VIEW));
    updateCounters();
    ({leads:leadsView,deals:()=>dealsView('sales'),supply:()=>dealsView('supply'),clients:clientsView,docs:docsView,tasks:tasksView,catalog:catalogView,analytics:analyticsView,settings:settingsView}[VIEW]||leadsView)();
  }
  const head=(t,r='')=>'<div class="page-h"><h1>'+t+'</h1>'+r+'</div>';
  const refreshBtn='<button class="btn-sec" id="refresh">↻</button>';
  const storeNote=()=>DATA._nostore?'<div class="note red">⚠️ Хранилище не подключено — данные не сохраняются.</div>':'';
  function bindCommon(){ const r=$('#refresh'); if(r)r.onclick=()=>loadAll().then(()=>toast('Обновлено')); $$('[data-go]',$('#main')).forEach(b=>b.onclick=()=>{VIEW=b.dataset.go;render();}); }

  /* ---------- ЛИДЫ ---------- */
  let LEAD_MODE=ls.get('riks_leadmode','kanban');
  function leadsView(){
    const rows=filt(DATA.leads);
    const top=head('Лиды','<div class="tabs"><button data-m="kanban" class="'+(LEAD_MODE==='kanban'?'on':'')+'">Канбан</button><button data-m="list" class="'+(LEAD_MODE==='list'?'on':'')+'">Список</button></div><div class="spacer"></div><button class="btn-pri" id="addLead">+ Лид</button>'+refreshBtn)+storeNote()+
      '<div class="note">Лид — это просто обращение, денег ещё нет. Когда понятно, что клиент заказывает, — «Создать сделку». Неопределившихся — в «Мусор / не определились».</div>';
    let body='';
    if(!rows.length) body='<div class="empty">Пока нет заявок. «+ Лид» — добавить звонок вручную.</div>';
    else if(LEAD_MODE==='kanban') body='<div class="kanban">'+LEAD_STAGES.map(st=>{const it=rows.filter(l=>(l.stage||'new')===st.k);
      return '<div class="col" data-stage="'+st.k+'"><div class="ch" style="background:'+st.col+'"><div class="cn">'+st.t+'</div><div class="cm">'+it.length+' лид.</div></div><div class="cards">'+it.map(leadCard).join('')+'</div></div>';}).join('')+'</div>';
    else body='<div class="table"><table><thead><tr><th>Имя</th><th>Телефон</th><th>Запрос</th><th>Источник</th><th>Стадия</th><th>Когда</th></tr></thead><tbody>'+rows.map(l=>{const s=srcOf(l.source),st=stOf(LEAD_STAGES,l.stage||'new');
      return '<tr class="click" data-id="'+esc(l.id)+'"><td class="nm">'+(esc(l.name)||'—')+'</td><td class="ph">'+esc(l.phone)+'</td><td>'+(esc(l.service)||'—')+'</td><td><span class="badge" style="background:'+s.c+'">'+esc(s.t)+'</span></td><td><span class="st-pill" style="background:'+st.col+'">'+st.t+'</span></td><td style="white-space:nowrap;color:var(--muted)">'+fmt(l.ts)+'</td></tr>';}).join('')+'</tbody></table></div>';
    $('#main').innerHTML=top+body; bindCommon();
    $$('[data-m]').forEach(b=>b.onclick=()=>{LEAD_MODE=b.dataset.m;ls.set('riks_leadmode',LEAD_MODE);render();});
    $('#addLead').onclick=()=>editLead(null);
    $$('tr[data-id]').forEach(tr=>tr.onclick=()=>openLead(tr.dataset.id));
    bindDnD('leads');
  }
  function leadCard(l){
    const s=srcOf(l.source), d=l.dealId?dealOf(l.dealId):null;
    return '<div class="card" draggable="true" data-id="'+esc(l.id)+'" style="border-left-color:'+s.c+'">'+
      '<div class="nm">'+(esc(l.name)||'Без имени')+'</div><div class="ph">'+esc(l.phone)+'</div>'+
      (l.service?'<div class="sv">'+esc(l.service)+'</div>':'')+(l.quiz?'<div class="tag" style="margin-top:6px;display:inline-block">📝 квиз заполнен</div>':'')+
      '<div class="meta"><span class="badge" style="background:'+s.c+'">'+esc(s.t)+'</span>'+(d?'<span class="tag">💼 '+money(dealTotal(d))+'</span>':'')+'<span class="tm">'+fmt(l.ts)+'</span></div></div>';
  }

  /* ---------- СДЕЛКИ ---------- */
  function dealsView(fk){
    const F=S().funnels[fk]; const rows=filt(DATA.deals.filter(d=>(d.funnel||'sales')===fk));
    const cols=F.stages.map(st=>{
      const it=rows.filter(d=>(d.status||'new')===st.k); const sum=it.reduce((a,d)=>a+dealTotal(d),0);
      return '<div class="col" data-stage="'+st.k+'"><div class="ch" style="background:'+st.col+'"><div class="cn">'+esc(st.t)+'</div><div class="cm"><span>'+it.length+' сд.'+(sum?' · '+money(sum):'')+'</span>'+(st.owner?'<span class="ow">👤 '+esc(st.owner)+'</span>':'')+'</div></div>'+
        '<div class="cards">'+it.map(dealCard).join('')+'</div></div>';
    }).join('');
    $('#main').innerHTML=head(fk==='supply'?'Поставщики':'Сделки','<div class="spacer"></div><button class="btn-pri" id="addDeal">+ '+(fk==='supply'?'Заказ поставщику':'Сделка')+'</button>'+refreshBtn)+storeNote()+
      (fk==='sales'?'<div class="note">Перетаскивайте карточки по стадиям. Если не заполнены обязательные поля — сделка дальше не пойдёт и CRM покажет, чего не хватает. Стадии, ответственные и обязательные поля — в «Настройках».</div>':'')+
      '<div class="kanban">'+cols+'</div>';
    bindCommon(); bindDnD('deals');
    $('#addDeal').onclick=()=>editDeal(null,null,fk);
  }
  function dealCard(d){
    const s=srcOf(d.source), total=dealTotal(d), rem=dealRem(d), miss=missingFor(d,d.status);
    return '<div class="card" draggable="true" data-id="'+esc(d.id)+'" style="border-left-color:'+s.c+'">'+
      '<div class="nm">'+(esc(d.client)||'Без имени')+'</div>'+(d.kind?'<div class="sv">'+esc(d.kind)+'</div>':'')+
      '<div class="sv">'+((d.items||[]).length)+' позиц.'+(d.deadline?' · до '+esc(d.deadline):'')+'</div>'+
      (total?'<div class="sum">'+money(total)+'</div>':'')+
      ((Number(d.prepaid)||0)>0&&rem>0?'<div class="rem">остаток '+money(rem)+'</div>':'')+
      (miss.length?'<div class="miss">⚠ не заполнено: '+miss.length+'</div>':'')+
      '<div class="meta"><span class="badge" style="background:'+s.c+'">'+esc(s.t)+'</span>'+(d.leadId?'<span class="tag">из лида</span>':'')+((d.files||[]).length?'<span class="tag">📎'+d.files.length+'</span>':'')+'</div></div>';
  }

  /* ---------- DnD ---------- */
  function bindDnD(col){
    let dragId=null;
    $$('.card').forEach(c=>{
      c.addEventListener('dragstart',e=>{dragId=c.dataset.id;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
      c.addEventListener('dragend',()=>{dragId=null;c.classList.remove('dragging');$$('.col').forEach(x=>x.classList.remove('drag-over'));});
      c.addEventListener('click',()=>{ if(!c.classList.contains('dragging')){ col==='leads'?openLead(c.dataset.id):editDeal(c.dataset.id);} });
    });
    $$('.col').forEach(cl=>{
      cl.addEventListener('dragover',e=>{e.preventDefault();cl.classList.add('drag-over');});
      cl.addEventListener('dragleave',()=>cl.classList.remove('drag-over'));
      cl.addEventListener('drop',async e=>{e.preventDefault();cl.classList.remove('drag-over');
        const k=cl.dataset.stage; if(!dragId||!k)return;
        if(col==='leads'){ const l=DATA.leads.find(x=>x.id===dragId); if(!l||l.stage===k)return; l.stage=k; render(); try{await save('leads',l);}catch(e){} return; }
        const d=dealOf(dragId); if(!d||d.status===k)return;
        const miss=missingFor(d,k);
        if(miss.length){ gateBlocked(d,k,miss); return; }
        moveDeal(d,k);
      });
    });
  }
  async function moveDeal(d,k){
    const st=stOf(stagesOf(d.funnel),k);
    d.status=k; d.log=[{ts:new Date().toISOString(),who:ME||'—',t:'→ '+st.t}].concat(d.log||[]).slice(0,60);
    render(); try{ const it=await save('deals',d); Object.assign(d,it); toast('→ '+st.t+(st.owner?' · '+st.owner:'')); tgOwner(d);}catch(e){}
  }
  function gateBlocked(d,k,miss){

  /* ---------- ФАЙЛЫ (Vercel Blob, закрытое хранилище) ---------- */
  const FCATS=[['mockup','📐','Макет'],['client','📥','От клиента: ТЗ, логотип'],['photo','📷','Фото объекта / замер'],['contract','📑','Договор'],['invoice','💳','Счёт'],['upd','🧾','УПД / акт'],['approval','🏛','Согласование'],['done','✅','Фото готовой работы'],['other','📎','Прочее']];
  const fcat=k=>FCATS.find(x=>x[0]===k)||FCATS[FCATS.length-1];
  const fsize=n=>!n?'':n<1048576?Math.max(1,Math.round(n/1024))+' КБ':(n/1048576).toFixed(n<1e7?1:0)+' МБ';
  const ficon=f=>f.link?'🔗':(/^image\//.test(f.type||'')||/\.(jpe?g|png|webp|gif|heic|bmp)$/i.test(f.name||''))?'🖼':(/pdf/i.test(f.type||'')||/\.pdf$/i.test(f.name||''))?'📕':/\.(cdr|ai|eps|psd|svg|tiff?)$/i.test(f.name||'')?'🎨':/\.(docx?|odt|rtf|txt)$/i.test(f.name||'')?'📘':/\.(xlsx?|csv|ods)$/i.test(f.name||'')?'📗':/\.(zip|rar|7z)$/i.test(f.name||'')?'🗜':fcat(f.cat)[1];
  const normFiles=a=>(Array.isArray(a)?a:[]).map(x=>typeof x==='string'?{id:'f'+genId(),name:x.replace(/^https?:\/\//,'').slice(0,90),link:x,cat:'other',ts:''}:x).filter(x=>x&&(x.path||x.link));
  let FILES_READY=null, BLOBLIB=null;
  async function filesReady(){ if(DEMO) return false; if(FILES_READY===true) return true;
    try{ const j=await (await fetch('/api/files',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pass:PASS,op:'status'})})).json(); FILES_READY=!!j.ready; }catch(e){ FILES_READY=false; } return FILES_READY; }
  // путь в хранилище — только латиница (подписанные ссылки Vercel ломаются на кириллице); русское имя хранится в f.name
  const TRL={а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
  const safeName=n=>{ const s=String(n||'file'), dot=s.lastIndexOf('.'), ext=dot>0?s.slice(dot+1).toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8):'';
    const base=(dot>0?s.slice(0,dot):s).toLowerCase().split('').map(c=>TRL[c]!=null?TRL[c]:c).join('').replace(/[^a-z0-9._-]+/g,'-').replace(/-+/g,'-').replace(/^[-.]+|[-.]+$/g,'').slice(0,80)||'file';
    return base+(ext?'.'+ext:''); };
  async function uploadOne(file,owner,meta,onProg){
    BLOBLIB=BLOBLIB||await import('./assets/blob-client.js');
    const path='riks/'+owner+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)+'-'+safeName(file.name);
    const o={access:'private',handleUploadUrl:'/api/files',clientPayload:JSON.stringify({pass:PASS}),multipart:file.size>40*1048576,onUploadProgress:ev=>onProg&&onProg(ev.percentage)};
    if(file.type) o.contentType=file.type;
    let r; try{ r=await BLOBLIB.uploadPresigned(path,file,o); }catch(e1){ try{ r=await BLOBLIB.upload(path,file,o); }catch(e2){ throw e1; } }
    return Object.assign({id:'f'+genId(),name:file.name,size:file.size,type:file.type||'',path:(r&&r.pathname)||path,cat:'other',doc:'',who:ME||'—',ts:new Date().toISOString()},meta||{});
  }
  // загрузить список файлов с прогрессом в элемент box; вернуть загруженные
  async function uploadMany(list,owner,meta,box){
    list=[...(list||[])]; if(!list.length) return [];
    if(DEMO){ toast('Демо: загрузка файлов отключена'); return []; }
    if(!(await filesReady())){ dialog('Хранилище файлов не подключено','<div class="note red">Чтобы загружать файлы в CRM, нужно один раз подключить хранилище в Vercel: <b>Storage → Create → Blob → Private</b> → подключить к проекту riks-s. После этого обновите страницу.</div><p style="color:var(--muted);font-size:13px">Пока можно добавить <b>ссылку</b> (Яндекс Диск, путь на сервере) — кнопка «🔗 Ссылка».</p>',{noSave:true}); return []; }
    const out=[];
    for(const f of list){
      const row=document.createElement('div'); row.className='file up'; row.innerHTML='<div class="fi">⏫</div><div style="flex:1;min-width:0"><div class="fn">'+esc(f.name)+'</div><div class="prog"><i></i></div></div><div class="fm">'+fsize(f.size)+'</div>';

      try{ out.push(await uploadOne(f,owner,meta,p=>{const i=row.querySelector('.prog i'); if(i)i.style.width=Math.round(p||0)+'%';})); row.remove(); }
      catch(err){ row.querySelector('.fi').textContent='⚠'; row.querySelector('.prog').outerHTML='<div class="fm" style="color:var(--bad)">не загрузился: '+esc(String(err&&err.message||err).slice(0,120))+'</div>'; }
    }
    if(out.length) toast('Загружено файлов: '+out.length);
    return out;
  }

  /* ---------- ответы опросника (квиза) ---------- */
  function parseQuiz(text){
    const m=String(text||'').match(/^(📞 Просит перезвонить\. )?Квиз «([^»]+)»(?:: ([\s\S]*?))?(?: \(без ответов\))?(?: ⚠ ([\s\S]*?))?(?: \| ([\s\S]*))?$/);
    if(!m) return null;
    const quiz=(m[3]||'').split('; ').map(s=>{const i=s.indexOf(' — ');return i>0?{q:s.slice(0,i).trim(),a:s.slice(i+3).trim()}:null;}).filter(Boolean);
    return {callback:!!m[1],title:m[2],quiz,warn:(m[4]||'').trim(),extra:(m[5]||'').trim()};
  }
  // из лида: структурированные ответы + флаги
  function quizOfLead(l){ const p=parseQuiz(l.detail)||{};
    const quiz=Array.isArray(l.quiz)&&l.quiz.length?l.quiz:(p.quiz||[]);
    return {quiz,quizTitle:p.title||'',quizCallback:!!(l.callback||p.callback),quizContact:l.contact||'',quizWarn:p.warn||'',extra:p.title?(p.extra||''):(l.detail||'')}; }
  function quizHTML(o){ if(!o||!((o.quiz||[]).length||o.quizCallback)) return '';
    return '<div class="qa-box"><div class="qa-h">📝 Ответы клиента'+(o.quizTitle?' <span>опросник «'+esc(o.quizTitle)+'»</span>':'')+'</div>'+
      ((o.quizContact==='Не важно'?(o.quizContact=''):0,(o.quizCallback||o.quizContact||o.quizWarn))?'<div class="qa-flags">'+(o.quizCallback?'<span class="flag warn">📞 Просил перезвонить</span>':'')+(o.quizContact?'<span class="flag">💬 Связаться: '+esc(o.quizContact)+'</span>':'')+(o.quizWarn?'<span class="flag warn">⚠ '+esc(o.quizWarn)+'</span>':'')+'</div>':'')+
      ((o.quiz||[]).length?'<div class="qa">'+o.quiz.map(x=>'<div class="qi"><div class="qq">'+esc(x.q)+'</div><div class="qv">'+esc(x.a)+'</div></div>').join('')+'</div>':'')+'</div>'; }

  /* ---------- клиент ↔ заказы ---------- */
  const dealsOfClient=c=>{ const n=normPhone(c.phone); return DATA.deals.filter(d=>d.funnel!=='supply'&&(d.clientId===c.id||(n&&!d.clientId&&normPhone(d.phone)===n))); };
  async function linkClient(rec){
    if(rec.funnel==='supply'||DEMO) return;
    let c=rec.clientId?DATA.clients.find(x=>x.id===rec.clientId):null;
    if(!c) c=clientByPhone(rec.phone)||(rec.inn?DATA.clients.find(x=>x.inn&&x.inn===rec.inn):null);
    if(!c&&!normPhone(rec.phone)&&!rec.client) return;
    const isNew=!c; const cc=Object.assign({id:'c-'+(normPhone(rec.phone)||genId()),src:'crm',reg:new Date().toISOString().slice(0,10)},c||{});

  function rubWords(n){
    n=Math.floor(Number(n)||0); if(!n) return 'ноль рублей';
    const u=['','один','два','три','четыре','пять','шесть','семь','восемь','девять'],uf=['','одна','две','три','четыре','пять','шесть','семь','восемь','девять'],
      t=['десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать'],
      d=['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'],h=['','сто','двести','триста','четыреста','пятьсот','шестьсот','семьсот','восемьсот','девятьсот'];
    const form=(x,f)=>{x%=100;if(x>10&&x<20)return f[2];x%=10;return x===1?f[0]:(x>1&&x<5?f[1]:f[2]);};
    const tri=(x,fem)=>{const a=[];a.push(h[Math.floor(x/100)]);const r=x%100;if(r>=10&&r<20)a.push(t[r-10]);else{a.push(d[Math.floor(r/10)]);a.push((fem?uf:u)[r%10]);}return a.filter(Boolean).join(' ');};
    const parts=[]; const mln=Math.floor(n/1e6),th=Math.floor(n/1e3)%1000,rest=n%1000;
    if(mln)parts.push(tri(mln)+' '+form(mln,['миллион','миллиона','миллионов']));
    if(th)parts.push(tri(th,true)+' '+form(th,['тысяча','тысячи','тысяч']));
    if(rest)parts.push(tri(rest));
    const s=parts.join(' ')+' '+form(n,['рубль','рубля','рублей']); return s.charAt(0).toUpperCase()+s.slice(1)+' 00 копеек';
  }

  function loadScript(src){ return new Promise((ok,err)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=err; document.head.appendChild(s); }); }
  async function importClients(file){
    if(!file)return; toast('Читаю файл…');
    let rows=[];
    try{
      if(!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}); const sh=wb.Sheets[wb.SheetNames[0]];
      rows=XLSX.utils.sheet_to_json(sh,{defval:''});
    }catch(e){ toast('Не удалось прочитать файл'); return; }
    const pick=(r,res)=>{ for(const k of Object.keys(r)) if(res.some(re=>re.test(k))) return r[k]; return ''; };
    const num=x=>Number(String(x).replace(/\s/g,'').replace(',','.'))||0;
    const out=rows.map(r=>{
      const name=String(pick(r,[/^имя|фио|^name|kunde|клиент|^контакт/i])||'').trim(), phone=String(pick(r,[/телефон|phone|telefon|мобильн/i])||'').trim();
      if(!name&&!phone) return null;
      const ex=clientByPhone(phone);
      return {id:ex?ex.id:('c-'+(normPhone(phone)||genId())),name:name||(ex&&ex.name)||'',phone,tags:String(pick(r,[/тег|stichw|сфера|tag|сегмент/i])||''),paid:num(pick(r,[/оплач|bezahlt|сумма покуп|выручк/i])),
        points:num(pick(r,[/балл|punkt|points/i])),reg:String(pick(r,[/регистр|registr|создан|дата/i])||''),from:String(pick(r,[/рекоменд|empfehl|источник|канал|откуда/i])||''),note:String(pick(r,[/заметк|hinweis|коммент|note/i])||''),src:'import'};
    }).filter(Boolean);
    if(!out.length){ toast('Не нашёл колонки «Имя» и «Телефон»'); return; }
    if(!confirm('Найдено клиентов: '+out.length+'. Загрузить в CRM?')) return;
    const r=await api('bulk','clients',{items:out}); if(r.ok){ toast('Загружено: '+r.saved); await loadAll(); VIEW='clients'; render(); } else toast('Ошибка загрузки');
  }

  const TKINDS=[['call','📞','Звонок'],['meet','📏','Замер / встреча'],['design','🎨','Дизайн'],['prod','🏭','Производство'],['mount','🔧','Монтаж'],['docs','📑','Документы'],['other','📌','Другое']];

  const TCOL=['#E3241B','#1E4FA3','#2e9e4f','#9b59b6','#e67e22','#00838f','#5d6d7e'];
  const whoCol=n=>{ const i=S().team.findIndex(m=>m.name===n); return i<0?'#8a817a':TCOL[i%TCOL.length]; };
  const isoD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const todayISO=()=>isoD(new Date());
  const addDays=(iso,n)=>{ const d=new Date(iso+'T12:00'); d.setDate(d.getDate()+n); return isoD(d); };
  const mondayOf=iso=>{ const d=new Date(iso+'T12:00'); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return isoD(d); };
  const DOW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const dHuman=iso=>{ if(!iso) return 'без срока'; const t=todayISO(); if(iso===t) return 'сегодня'; if(iso===addDays(t,1)) return 'завтра'; if(iso===addDays(t,-1)) return 'вчера'; const d=new Date(iso+'T12:00'); return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+', '+DOW[(d.getDay()+6)%7].toLowerCase(); };
  const tBucket=t=>{ if(t.done) return 'done'; if(!t.due) return 'nodue'; const td=todayISO(); if(t.due<td) return 'over'; if(t.due===td) return 'today'; if(t.due===addDays(td,1)) return 'tom'; if(t.due<=addDays(td,7)) return 'week'; return 'later'; };

  // загрузка документа в заказ прямо со страницы «Документы»
  function uploadToDeal(dealId,cat){
    const deals=DATA.deals.filter(d=>d.funnel!=='supply').sort((a,b)=>String(b.ts||'').localeCompare(String(a.ts||'')));
    if(!deals.length){ toast('Сначала создайте сделку'); return; }
    const sel=dealId||deals[0].id;
    const docOpts=d=>'<option value="">— не привязывать —</option>'+BASE_DOCS.concat(kindDocList(d&&d.kind)).map(x=>'<option value="'+x[0]+'">'+esc(x[1])+'</option>').join('');
    dialog('Загрузить документ в заказ',
      '<div class="fld"><div class="k">Заказ</div><select class="inp" id="u_deal">'+deals.map(d=>'<option value="'+esc(d.id)+'"'+(d.id===sel?' selected':'')+'>'+esc(d.client||'—')+' · '+esc(d.kind||'заказ')+' · '+esc(stOf(stagesOf(d.funnel),d.status).t)+' · '+fdate(d.ts)+'</option>').join('')+'</select></div>'+
      '<div class="grid2"><div class="fld"><div class="k">Тип файла</div><select class="inp" id="u_cat">'+FCATS.map(x=>'<option value="'+x[0]+'"'+(x[0]===(cat||'contract')?' selected':'')+'>'+x[1]+' '+x[2]+'</option>').join('')+'</select></div>'+
      '<div class="fld"><div class="k">Это пункт чек-листа?</div><select class="inp" id="u_doc">'+docOpts(dealOf(sel))+'</select></div></div>'+
      '<div class="drop" id="u_drop">Перетащите файлы сюда или <b>выберите</b></div><div class="files" id="u_list" style="margin-top:8px"></div>',{noSave:true});
    $('#u_deal').onchange=()=>{ $('#u_doc').innerHTML=docOpts(dealOf($('#u_deal').value)); };
    $('#u_doc').onchange=()=>{ const k=$('#u_doc').value; if(k&&DOC_CAT[k]) $('#u_cat').value=DOC_CAT[k]; else if(k) $('#u_cat').value='approval'; };
    const go=async fl=>{ const d=dealOf($('#u_deal').value); if(!d) return; const doc=$('#u_doc').value;
      const got=await uploadMany(fl,'d-'+d.id,{cat:$('#u_cat').value,doc},$('#u_list')); if(!got.length) return;
      const docs=Object.assign({},d.docs||{}); if(doc&&!docs[doc]) docs[doc]={at:new Date().toISOString(),by:ME||'—'};
      const log=[{ts:new Date().toISOString(),who:ME||'—',t:'📎 загрузил(а): '+got.map(f=>f.name).join(', ')}].concat(d.log||[]).slice(0,80);
      try{ const it=normDeal(await save('deals',Object.assign({},d,{files:got.concat(normFiles(d.files)),docs,log}))); Object.assign(d,it); }catch(e){}
      $('#u_list').insertAdjacentHTML('afterbegin',got.map(f=>'<div class="file"><div class="fi">✅</div><div class="fn">'+esc(f.name)+'</div><div class="fm" style="margin-left:auto">в заказ «'+esc(d.client||'')+'»</div></div>').join(''));
      if(VIEW==='docs') docsView(); };
    $('#u_drop').onclick=()=>pickFiles(go); bindDrop($('#u_drop'),go);
  }

  let CAT_SEL=ls.get('riks_cat','all'), CAT_Q='';
  const CAT_ORDER=['Наружная реклама','Неоновые вывески','Реклама на транспорте','Стенды','Мобильные стойки','Полиграфия','Различные наклейки','Широкоформатная печать','Добрая сувенирка'];
  function catalogView(){
    const all=DATA.catalog, q=CAT_Q.trim().toLowerCase();
    const cats={}; all.forEach(i=>{const c=i.category||'Прочее';cats[c]=(cats[c]||0)+1;});
