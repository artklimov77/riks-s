<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рикс+С — CRM</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --b-blue:#2a8add; --b-blue2:#27b4e8; --b-blue-d:#1a6db5;
    --bg:#eef2f4; --panel:#fff; --line:#e3e7ec; --line2:#d5dde3;
    --ink:#333; --muted:#6a7681; --muted2:#9aa7b2;
    --st-new:#55d0e0; --st-work:#2fc6f6; --st-kp:#ffa900; --st-deal:#a673e8; --st-done:#9dcf00; --st-fail:#ff5752;
    --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Open Sans',system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit}

  .gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--b-blue),var(--b-blue2));z-index:100}
  .gate .box{background:#fff;border-radius:10px;padding:34px 30px;width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .gate .logo{font-weight:700;font-size:22px;color:var(--b-blue-d)}.gate .logo b{color:var(--st-fail)}
  .gate p{color:var(--muted);font-size:13px;margin:6px 0 18px}
  .gate input{width:100%;height:46px;border:1.5px solid var(--line2);border-radius:7px;padding:0 14px;font-size:15px;outline:none}
  .gate input:focus{border-color:var(--b-blue)}
  .gate button{width:100%;height:46px;border-radius:7px;background:var(--b-blue);color:#fff;font-weight:600;font-size:15px;margin-top:12px}
  .gate .err{color:var(--st-fail);font-size:13px;min-height:18px;margin-top:10px}

  .app{display:none;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:40;height:54px;background:linear-gradient(90deg,var(--b-blue),var(--b-blue2));display:flex;align-items:center;gap:16px;padding:0 18px;color:#fff}
  .topbar .brand{font-weight:700;font-size:17px;white-space:nowrap}
  .topbar .search{flex:1;max-width:460px}
  .topbar .search input{width:100%;height:34px;border:none;border-radius:6px;padding:0 14px;font-size:14px;outline:none;background:rgba(255,255,255,.95)}
  .topbar .sp{flex:1}
  .topbar .tb-btn{color:#fff;font-size:13px;font-weight:600;padding:7px 12px;border-radius:6px;background:rgba(255,255,255,.16)}
  .topbar .tb-btn:hover{background:rgba(255,255,255,.28)}
  .topbar .ava{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--b-blue-d);font-weight:700;display:flex;align-items:center;justify-content:center}

  .body{display:flex;align-items:flex-start}
  .side{width:220px;flex:0 0 220px;background:var(--panel);border-right:1px solid var(--line);min-height:calc(100vh - 54px);position:sticky;top:54px}
  .side .grp{padding:10px 0;border-bottom:1px solid var(--line)}
  .side .gt{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted2);padding:6px 18px 4px;font-weight:700}
  .side .nav{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:14px;color:#404a54;border-left:3px solid transparent;cursor:pointer}
  .side .nav .ic{width:18px;text-align:center;font-size:15px}
  .side .nav:hover{background:#f5f8fa}
  .side .nav.on{background:#eaf5fd;border-left-color:var(--b-blue);color:var(--b-blue-d);font-weight:600}
  .side .nav .cnt{margin-left:auto;background:var(--st-fail);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}

  .main{flex:1;min-width:0;padding:18px 20px 60px}
  .page-h{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .page-h h1{font-size:22px;font-weight:700}
  .tabs{display:flex;gap:4px;background:#e2e8ec;border-radius:8px;padding:3px}
  .tabs button{padding:7px 16px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  .btn-pri{background:var(--b-blue);color:#fff;font-weight:600;font-size:13px;border-radius:7px;padding:9px 16px}
  .btn-pri:hover{background:var(--b-blue-d)}
  .btn-sec{border:1.5px solid var(--b-blue);color:var(--b-blue-d);font-weight:600;font-size:13px;border-radius:7px;padding:8px 14px}
  .spacer{margin-left:auto}

  .note{background:#fff8e1;border:1px solid #ffe0a3;color:#8a6d00;border-radius:8px;padding:12px 16px;font-size:13px;margin-bottom:14px}

  .kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
  .col{flex:0 0 250px;width:250px;background:#e7edf1;border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 200px)}
  .col.drag-over{outline:2px dashed var(--b-blue);outline-offset:-2px}
  .col .ch{padding:10px 12px 8px;border-radius:10px 10px 0 0;color:#fff}
  .col .ch .cn{font-weight:700;font-size:13px}
  .col .ch .cm{font-size:11px;opacity:.9;margin-top:2px}
  .col .cards{padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:40px}
  .card{background:#fff;border-radius:8px;padding:10px 11px;box-shadow:var(--shadow);cursor:pointer;border-left:3px solid var(--line2)}
  .card:hover{box-shadow:0 2px 8px rgba(0,0,0,.14)}
  .card.dragging{opacity:.4}
  .card .nm{font-weight:700;font-size:13px}
  .card .ph{font-size:13px;color:var(--b-blue-d);font-weight:600;margin-top:2px}
  .card .sv{font-size:12px;color:var(--muted);margin-top:4px}
  .card .sum{font-weight:700;font-size:14px;margin-top:6px}
  .card .meta{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
  .badge{font-size:10px;font-weight:700;padding:3px 7px;border-radius:4px;color:#fff;white-space:nowrap}
  .card .tm{font-size:10px;color:var(--muted2);margin-left:auto}

  .table{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto}
  .table table{width:100%;border-collapse:collapse;min-width:640px}
  .table th{background:#f5f8fa;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);font-weight:700}
  .table td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  .table tr:last-child td{border-bottom:none}
  .table tr:hover td{background:#f8fbfd}
  .table .nm{font-weight:700}
  .table .ph{color:var(--b-blue-d);font-weight:600}
  .st-pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:12px;color:#fff;display:inline-block}
  .cat-h{font-weight:700;font-size:14px;margin:18px 0 8px;color:var(--b-blue-d)}
  .inp{height:36px;border:1.5px solid var(--line2);border-radius:6px;padding:0 10px;font-size:13px;outline:none;width:100%;background:#fff}
  .inp:focus{border-color:var(--b-blue)}
  td .inp{height:32px}
  .ic-btn{width:32px;height:32px;border-radius:6px;font-size:15px;color:var(--muted)}
  .ic-btn:hover{background:#eef2f4}
  .ic-btn.del:hover{background:#ffe9e9;color:var(--st-fail)}

  .cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .kpi b{display:block;font-size:28px;font-weight:700;letter-spacing:-.02em}
  .kpi span{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
  .chart{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
  .chart h3{font-size:14px;font-weight:700;margin-bottom:14px}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .bar-row .bl{width:120px;font-size:12px;color:var(--muted);text-align:right;flex:0 0 120px}
  .bar-row .bt{flex:1;background:#eef2f4;border-radius:5px;height:22px;overflow:hidden}
  .bar-row .bf{height:100%;border-radius:5px;display:flex;align-items:center;padding:0 8px;color:#fff;font-size:11px;font-weight:700;min-width:26px}
  .funnel{display:flex;gap:8px;flex-wrap:wrap}
  .funnel .fstep{flex:1;min-width:84px;text-align:center;padding:14px 8px;border-radius:8px;color:#fff}
  .funnel .fstep b{display:block;font-size:22px;font-weight:700}
  .funnel .fstep span{font-size:11px;font-weight:600;opacity:.95}
  .empty{text-align:center;color:var(--muted);padding:50px 0}

  /* drawer + modal */
  .scrim{position:fixed;inset:0;background:rgba(20,30,40,.4);z-index:60;display:none}
  .scrim.on{display:block}
  .drawer{position:fixed;top:0;right:0;height:100%;width:420px;max-width:92vw;background:#fff;z-index:70;transform:translateX(100%);transition:transform .22s ease;box-shadow:-8px 0 30px rgba(0,0,0,.2);display:flex;flex-direction:column}
  .drawer.on{transform:translateX(0)}
  .drawer .dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
  .drawer .dh .nm{font-size:19px;font-weight:700}
  .drawer .dh .x{margin-left:auto;font-size:22px;color:var(--muted);line-height:1}
  .drawer .dc{padding:18px 20px;overflow-y:auto;flex:1}
  .fld{margin-bottom:13px}
  .fld .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted2);font-weight:700;margin-bottom:4px}
  .fld .v{font-size:14px}.fld .v a{color:var(--b-blue-d);font-weight:600}
  .stages{display:flex;flex-wrap:wrap;gap:6px}
  .stages button{font-size:12px;font-weight:600;padding:7px 11px;border-radius:6px;border:1.5px solid var(--line2);color:var(--muted)}
  .stages button.on{color:#fff;border-color:transparent}
  textarea.inp{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
  .drawer .df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px}
  .drawer .df .call{flex:1;height:44px;border-radius:7px;background:var(--st-done);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px}
  .drawer .df .save{flex:1;height:44px;border-radius:7px;background:var(--b-blue);color:#fff;font-weight:700;font-size:14px}

  .modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.98);width:560px;max-width:94vw;max-height:90vh;background:#fff;border-radius:12px;z-index:80;display:none;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.3)}
  .modal.on{display:flex;transform:translate(-50%,-50%) scale(1)}
  .modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
  .modal .mh h2{font-size:18px;font-weight:700}
  .modal .mh .x{margin-left:auto;font-size:22px;color:var(--muted)}
  .modal .mb{padding:18px 20px;overflow-y:auto}
  .modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .items-t{width:100%;border-collapse:collapse;margin-top:6px}
  .items-t th{font-size:10px;text-transform:uppercase;color:var(--muted2);text-align:left;padding:4px 6px;font-weight:700}
  .items-t td{padding:3px 6px;vertical-align:middle}
  .items-t .q{width:64px}.items-t .p{width:96px}.items-t .s{width:90px;text-align:right;font-weight:700;white-space:nowrap}
  .ord-total{text-align:right;font-size:18px;font-weight:700;margin-top:10px}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:#fff;padding:11px 20px;border-radius:8px;font-size:13px;z-index:95;opacity:0;transition:.2s;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:720px){.side{display:none}.topbar .search{max-width:none}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="box">
    <div class="logo">Рикс<b>+</b>С · CRM</div>
    <p>Внутренняя панель. Введите пароль.</p>
    <input type="password" id="pass" placeholder="Пароль" autocomplete="current-password">
    <button id="enter">Войти</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div class="app" id="app">
  <div class="topbar">
    <div class="brand">Рикс<b>+</b>С</div>
    <div class="search"><input id="q" type="search" placeholder="Поиск по имени, телефону, услуге…"></div>
    <div class="sp"></div>
    <button class="tb-btn" id="exit">Выход</button>
    <div class="ava">Р</div>
  </div>
  <div class="body">
    <aside class="side">
      <div class="grp">
        <div class="gt">CRM</div>
        <div class="nav on" data-view="leads"><span class="ic">▦</span> Лиды · Воронка <span class="cnt" id="navCnt" style="display:none"></span></div>
        <div class="nav" data-view="leadlist"><span class="ic">☰</span> Лиды · Список</div>
        <div class="nav" data-view="orders"><span class="ic">📦</span> Заказы</div>
      </div>
      <div class="grp">
        <div class="gt">Каталог</div>
        <div class="nav" data-view="catalog"><span class="ic">₽</span> Прайс / услуги</div>
      </div>
      <div class="grp">
        <div class="gt">Отчёты</div>
        <div class="nav" data-view="analytics"><span class="ic">📊</span> Аналитика</div>
        <div class="nav" data-view="channels"><span class="ic">🔌</span> Источники</div>
      </div>
      <div class="grp">
        <div class="gt">Система</div>
        <div class="nav" data-view="settings"><span class="ic">⚙️</span> Настройка</div>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<div class="drawer" id="drawer">
  <div class="dh"><div><div class="nm" id="dNm">—</div><div style="color:var(--muted);font-size:13px" id="dSub"></div></div><button class="x" id="dClose">&times;</button></div>
  <div class="dc" id="dBody"></div>
  <div class="df"><a class="call" id="dCall">📞 Позвонить</a><button class="save" id="dSave">Сохранить</button></div>
</div>

<div class="modal" id="modal">
  <div class="mh"><h2 id="mTitle">—</h2><button class="x" id="mClose">&times;</button></div>
  <div class="mb" id="mBody"></div>
  <div class="mf"><button class="btn-sec" id="mCancel">Отмена</button><button class="btn-pri" id="mSave">Сохранить</button></div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  const genId = () => (Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8));
  const money = n => (Number(n)||0).toLocaleString('ru-RU')+' ₽';
  const fmt = ts => { try { return new Date(ts).toLocaleString('ru-RU',{timeZone:'Europe/Moscow',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); } catch(e){ return ts||''; } };
  const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1900); };

  const LEAD_STAGES=[
    {k:'new',t:'Новая',col:'#55d0e0'},{k:'work',t:'В обработке',col:'#2fc6f6'},
    {k:'kp',t:'Замер / КП',col:'#ffa900'},{k:'deal',t:'Договор',col:'#a673e8'},
    {k:'done',t:'Выполнено',col:'#9dcf00'},{k:'fail',t:'Отказ',col:'#ff5752'}];
  const ORDER_STAGES=[
    {k:'new',t:'Новый',col:'#55d0e0'},{k:'prod',t:'В производстве',col:'#2fc6f6'},
    {k:'ready',t:'Готов',col:'#ffa900'},{k:'done',t:'Выдан / Оплачен',col:'#9dcf00'},
    {k:'cancel',t:'Отказ',col:'#ff5752'}];
  const stOf = (arr,k)=>arr.find(s=>s.k===k)||arr[0];

  const SRC=[
    {re:/avito|авито/i,t:'Авито',c:'#0a8f3c'},{re:/vk|вконтакт/i,t:'ВКонтакте',c:'#2787f5'},
    {re:/t\.me|telegram|телеграм/i,t:'Telegram',c:'#29a9eb'},{re:/yandex|яндекс|карт|maps/i,t:'Яндекс',c:'#ff3d00'},
    {re:/2gis|2гис/i,t:'2ГИС',c:'#39c936'},{re:/google/i,t:'Google',c:'#4285f4'},
    {re:/реферал|ref|qr|повтор/i,t:'Реферал',c:'#8e44ad'},{re:/звон|тел|phone/i,t:'Звонок',c:'#e67e22'}];
  const srcOf=s=>{s=(s||'');for(const x of SRC)if(x.re.test(s))return x;return {t:'Сайт / прямой',c:'#6b7a8d'};};
  const SRC_OPTS=['Звонок','Сайт','Авито','ВКонтакте','Telegram','Яндекс Карты','2ГИС','Реферал','Повторный'];
  const CATS=['Вывески','Неон','Транспорт','Полиграфия','Стенды','Печать','Прочее'];
  const UNITS=['шт','м²','п.м.','компл.','услуга'];

  let PASS='', DEMO=false, VIEW='leads', Q='';
  const DATA={leads:[],orders:[],catalog:[]};

  /* ---------- API ---------- */
  async function api(op,col,extra){
    if(DEMO) return {ok:true,demo:true};
    const r=await fetch('/api/db',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({pass:PASS,op,col},extra||{}))});
    if(r.status===401) throw new Error('auth');
    return r.json();
  }
  async function loadAll(){
    if(DEMO){ render(); return; }
    const [l,o,c]=await Promise.all([api('list','leads'),api('list','orders'),api('list','catalog')]);
    DATA.leads=l.items||[]; DATA.orders=o.items||[]; DATA.catalog=c.items||[];
    DATA._nostore = (l.note==='storage-not-configured');
    if(!DATA._nostore && !DATA.catalog.length){
      const s=await api('seedCatalog','catalog'); if(s.items) DATA.catalog=s.items;
    }
    render();
  }
  async function save(col,rec){
    if(DEMO){ toast('Демо: сохранение отключено'); return rec; }
    const r=await api('save',col,{data:rec});
    if(r.ok) return r.item||rec;
    toast(r.note==='storage-not-configured'?'Подключите Upstash Redis в Vercel':'Не сохранилось'); throw new Error('save');
  }
  async function remove(col,id){
    if(DEMO){ toast('Демо: удаление отключено'); return; }
    const r=await api('delete',col,{id}); if(!r.ok) toast('Не удалилось');
  }

  const filt = arr => { const q=Q.trim().toLowerCase(); if(!q)return arr;
    return arr.filter(x=>JSON.stringify(x).toLowerCase().includes(q)); };

  /* ---------- render switch ---------- */
  function render(){
    document.querySelectorAll('.side .nav').forEach(n=>n.classList.toggle('on',n.dataset.view===VIEW));
    const nu=DATA.leads.filter(l=>(l.stage||'new')==='new').length;
    const nc=$('#navCnt'); if(nu){nc.style.display='flex';nc.textContent=nu;}else nc.style.display='none';
    ({leads:leadsKanban,leadlist:leadList,orders:ordersView,catalog:catalogView,
      analytics:analyticsView,channels:channelsView,settings:settingsView}[VIEW]||leadsKanban)();
  }
  const head=(title,right='')=>'<div class="page-h"><h1>'+title+'</h1>'+right+'</div>';
  const refreshBtn='<button class="btn-sec" id="refresh">↻ Обновить</button>';
  const storeNote=()=>DATA._nostore?'<div class="note">⚠️ Хранилище (Upstash Redis) не подключено — данные не сохраняются. Включите Storage в Vercel (раздел «Настройка»).</div>':'';

  /* ---------- LEADS kanban ---------- */
  function leadsKanban(){
    const rows=filt(DATA.leads);
    const cols=LEAD_STAGES.map(st=>{
      const items=rows.filter(l=>(l.stage||'new')===st.k);
      return '<div class="col" data-stage="'+st.k+'"><div class="ch" style="background:'+st.col+'">'+
        '<div class="cn">'+st.t+'</div><div class="cm">'+items.length+' лид.</div></div>'+
        '<div class="cards" data-stage="'+st.k+'">'+items.map(leadCard).join('')+'</div></div>';
    }).join('');

  /* ---------- ANALYTICS ---------- */
  function analyticsView(){
    const L=DATA.leads,O=DATA.orders;
    const bySrc={}; L.forEach(l=>{const t=srcOf(l.source).t;bySrc[t]=(bySrc[t]||0)+1;});
    const byStage={}; LEAD_STAGES.forEach(s=>byStage[s.k]=0); L.forEach(l=>byStage[l.stage||'new']++);
    const revenue=O.filter(o=>o.status==='done').reduce((a,o)=>a+(Number(o.total)||0),0);
    const pipeline=O.filter(o=>o.status!=='done'&&o.status!=='cancel').reduce((a,o)=>a+(Number(o.total)||0),0);
    const conv=L.length?Math.round(byStage.done/L.length*100):0;
    const maxSrc=Math.max(1,...Object.values(bySrc));
    const kpis='<div class="cards-row">'+

      '<div class="kpi"><b>'+money(pipeline)+'</b><span>В работе</span></div>'+
      '<div class="kpi"><b>'+conv+'%</b><span>Конверсия лидов</span></div></div>';
    const srcBars=Object.entries(bySrc).sort((a,b)=>b[1]-a[1]).map(([t,n])=>{
      const c=(SRC.find(x=>x.t===t)||{c:'#6b7a8d'}).c;
      return '<div class="bar-row"><div class="bl">'+t+'</div><div class="bt"><div class="bf" style="width:'+Math.max(8,n/maxSrc*100)+'%;background:'+c+'">'+n+'</div></div></div>';
    }).join('')||'<div class="empty">Нет данных</div>';
    const funnel='<div class="funnel">'+LEAD_STAGES.map(s=>'<div class="fstep" style="background:'+s.col+'"><b>'+byStage[s.k]+'</b><span>'+s.t+'</span></div>').join('')+'</div>';

    const oFunnel='<div class="funnel">'+ORDER_STAGES.map(s=>'<div class="fstep" style="background:'+s.col+'"><b>'+oByStatus[s.k]+'</b><span>'+s.t+'</span></div>').join('')+'</div>';
    $('#main').innerHTML=head('Аналитика',refreshBtn)+storeNote()+kpis+
      '<div class="chart"><h3>Лиды по источникам</h3>'+srcBars+'</div>'+
      '<div class="chart"><h3>Воронка лидов</h3>'+funnel+'</div>'+
      '<div class="chart"><h3>Заказы по статусам</h3>'+oFunnel+'</div>';
    bindCommon();
  }

  /* ---------- drag & drop (generic) ---------- */
  function bindDnD(col,stages){
    let dragId=null;
    document.querySelectorAll('.card').forEach(c=>{
      c.addEventListener('dragstart',e=>{dragId=c.dataset.id;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
      c.addEventListener('dragend',()=>{dragId=null;c.classList.remove('dragging');document.querySelectorAll('.col').forEach(x=>x.classList.remove('drag-over'));});
      c.addEventListener('click',()=>{ if(!c.classList.contains('dragging')){ col==='leads'?openLead(c.dataset.id):editOrder(c.dataset.id);} });
    });
    document.querySelectorAll('.col').forEach(cl=>{
      cl.addEventListener('dragover',e=>{e.preventDefault();cl.classList.add('drag-over');});
      cl.addEventListener('dragleave',()=>cl.classList.remove('drag-over'));
      cl.addEventListener('drop',async e=>{e.preventDefault();cl.classList.remove('drag-over');
        const k=cl.dataset.stage; if(!dragId||!k)return;
        if(col==='leads'){ const l=DATA.leads.find(x=>x.id===dragId); if(!l)return; l.stage=k; render();
          try{await save('leads',l); toast(stOf(stages,k).t);}catch(e){} }
        else { const o=DATA.orders.find(x=>x.id===dragId); if(!o)return; o.status=k; render();
          try{await save('orders',o); toast(stOf(stages,k).t);}catch(e){} }
      });
    });
  }

      (id?'<div class="fld"><button class="btn-sec" id="o_del" style="border-color:#f2b8b8;color:var(--st-fail)">Удалить заказ</button></div>':''));

    const tb=$('#o_items');
    const rowHTML=(it)=>'<tr>'+
      '<td><select class="inp o-cat" style="margin-bottom:4px">'+catOpts+'</select>'+
      '<input class="inp o-name" value="'+esc(it.name||'')+'" placeholder="или вручную"></td>'+
      '<td class="q"><input class="inp o-qty" type="number" min="0" step="0.1" value="'+(it.qty||1)+'"></td>'+
      '<td class="p"><input class="inp o-price" type="number" min="0" value="'+(Number(it.price)||0)+'"></td>'+
      '<td class="s o-sum">0 ₽</td><td><button class="ic-btn del o-rm">🗑</button></td></tr>';
    function recalc(){ let t=0; tb.querySelectorAll('tr').forEach(tr=>{
        const q=Number(tr.querySelector('.o-qty').value)||0, p=Number(tr.querySelector('.o-price').value)||0;
        tr.querySelector('.o-sum').textContent=money(q*p); t+=q*p; });
      $('#o_total').textContent='Итого: '+money(t); return t; }
    function wireRow(tr){
      tr.querySelector('.o-cat').onchange=ev=>{const c=DATA.catalog.find(x=>x.id===ev.target.value);
        if(c){tr.querySelector('.o-name').value=c.name;tr.querySelector('.o-price').value=c.price;recalc();}};
      tr.querySelectorAll('.o-qty,.o-price').forEach(i=>i.oninput=recalc);
      tr.querySelector('.o-rm').onclick=()=>{tr.remove();recalc();};
    }
    items.forEach(it=>{ tb.insertAdjacentHTML('beforeend',rowHTML(it)); wireRow(tb.lastElementChild); });
    recalc();
    $('#o_add').onclick=()=>{ tb.insertAdjacentHTML('beforeend',rowHTML({name:'',qty:1,price:0})); wireRow(tb.lastElementChild); recalc(); };
    if(id)$('#o_del').onclick=async()=>{ if(!confirm('Удалить заказ?'))return; await remove('orders',id); DATA.orders=DATA.orders.filter(x=>x.id!==id); hideModal(); render(); };

    $('#mSave').onclick=async()=>{
      const rows=[...tb.querySelectorAll('tr')].map(tr=>({name:tr.querySelector('.o-name').value.trim(),
        qty:Number(tr.querySelector('.o-qty').value)||0,price:Number(tr.querySelector('.o-price').value)||0})).filter(r=>r.name);
      const total=rows.reduce((a,r)=>a+r.qty*r.price,0);
      const rec=Object.assign({},e,{id:e.id||genId(),client:$('#o_client').value.trim(),phone:$('#o_phone').value.trim(),
        status:$('#o_status').value,deadline:$('#o_deadline').value.trim(),items:rows,total,note:$('#o_note').value.trim(),
        source:e.source||'CRM',ts:e.ts||new Date().toISOString()});
      if(!rec.client&&!rows.length){toast('Заполните клиента или позиции');return;}
      try{ const it=await save('orders',rec); const i=DATA.orders.findIndex(x=>x.id===rec.id);
        if(i>=0)DATA.orders[i]=it; else DATA.orders.unshift(it); toast('Заказ сохранён'); hideModal(); render(); }catch(err){}
    };
  }

  /* ---------- common ---------- */
  function bindCommon(){ const r=$('#refresh'); if(r)r.onclick=()=>loadAll();
    $('#main').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{VIEW=b.dataset.go;render();}); }
  document.querySelectorAll('.side .nav').forEach(n=>n.onclick=()=>{VIEW=n.dataset.view;render();});
  $('#q').addEventListener('input',e=>{Q=e.target.value; render();});

  /* ---------- auth / load ---------- */
  async function enter(){ const p=$('#pass').value.trim(); if(!p)return;
    try{ PASS=p; await loadAll(); try{localStorage.setItem('riks_leads_pass',p);}catch(e){}
      $('#gate').style.display='none'; $('#app').style.display='block'; }
    catch(e){ $('#err').textContent='Неверный пароль или хранилище недоступно.'; } }
  $('#enter').onclick=enter; $('#pass').addEventListener('keydown',e=>{if(e.key==='Enter')enter();});
  $('#exit').onclick=()=>{try{localStorage.removeItem('riks_leads_pass');}catch(e){}location.reload();};
